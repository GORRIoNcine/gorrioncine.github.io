# Panel de administración GORRIóN (Sveltia CMS, compatible con Decap CMS).
# Guía: GUIA-PUBLICACION.md. Cambia 'repo' si el repositorio tiene otro nombre.
backend:
  name: github
  repo: gorrioncine/gorrioncine.github.io
  branch: main
  base_url: https://sveltia-cms-auth.niguelcruzz2.workers.dev

site_url: https://gorrioncine.github.io
logo_url: https://gorrioncine.github.io/admin/logo.svg
display_url: https://gorrioncine.github.io
locale: es
media_folder: uploads
public_folder: /uploads

collections:
  - name: contenido
    label: Contenido del sitio
    label_singular: Sección
    description: Textos, fotos y datos de la web. Cada cambio se guarda y se publica solo en 1–2 minutos.
    files:
      - name: seo
        label: "Buscadores (SEO)"
        file: content/seo.json
        fields:
          - label: "Permitir que Google y otros buscadores muestren la web"
            name: indexar
            widget: boolean
            required: false
            default: true
            hint: "Déjalo activado. Si lo apagas, la web desaparece poco a poco de los buscadores (útil solo mientras trabajas en ella)."
          - label: "Título de la portada en Google"
            name: homeTitle
            widget: object
            required: false
            collapsed: true
            summary: "{{fields.es}}"
            hint: "Si lo dejas vacío: «GORRIóN · Productora audiovisual independiente de La Habana». Ideal: menos de 60 letras."
            fields:
              - label: "Español"
                name: es
                widget: string
                required: false
              - label: "English"
                name: en
                widget: string
                required: false
          - label: "Descripción de la portada en Google"
            name: homeDesc
            widget: object
            required: false
            collapsed: true
            summary: "{{fields.es}}"
            hint: "Una o dos frases que explican qué es GORRIóN. Ideal: entre 80 y 160 letras."
            fields:
              - label: "Español"
                name: es
                widget: string
                required: false
              - label: "English"
                name: en
                widget: string
                required: false
          - label: "Otras páginas (Proyectos, Servicios, Contacto…)"
            name: pages
            widget: list
            required: false
            collapsed: true
            summary: "{{fields.page}}"
            label_singular: "página"
            hint: "Opcional. Si no añades una página, se usa el texto por defecto."
            fields:
              - label: "Página"
                name: page
                widget: select
                options:
                  - { label: "Proyectos", value: "proyectos" }
                  - { label: "Servicios", value: "servicios" }
                  - { label: "Nosotros", value: "nosotros" }
                  - { label: "Prensa y premios", value: "prensa" }
                  - { label: "Noticias", value: "noticias" }
                  - { label: "Contacto", value: "contacto" }
                  - { label: "Aviso legal", value: "legal" }
              - label: "Título en Google"
                name: title
                widget: object
                required: false
                collapsed: true
                summary: "{{fields.es}}"
                fields:
                  - label: "Español"
                    name: es
                    widget: string
                    required: false
                  - label: "English"
                    name: en
                    widget: string
                    required: false
              - label: "Descripción en Google"
                name: description
                widget: object
                required: false
                collapsed: true
                summary: "{{fields.es}}"
                fields:
                  - label: "Español"
                    name: es
                    widget: string
                    required: false
                  - label: "English"
                    name: en
                    widget: string
                    required: false
          - label: "Imagen al compartir en redes (por defecto)"
            name: ogImage
            widget: image
            required: false
            hint: "Se ve al compartir el enlace en WhatsApp, Facebook, X… Tamaño ideal 1200×630. Si no subes ninguna, se usa el logo."
          - label: "Código de verificación de Google Search Console"
            name: googleVerification
            widget: string
            required: false
            hint: "Pega solo el código (lo que va dentro de content=\"…\") que te da Google al elegir «Etiqueta HTML»."
          - label: "Código de verificación de Bing Webmaster"
            name: bingVerification
            widget: string
            required: false
            hint: "Opcional. Solo el código de la etiqueta msvalidate.01."
      - name: site
        label: "Datos generales y contacto"
        file: content/site.json
        fields:
          - label: "Correo de contacto"
            name: email
            widget: string
          - label: "Correo de prensa"
            name: pressEmail
            widget: string
          - label: "Ciudad"
            name: city
            widget: object
            required: true
            collapsed: true
            summary: "{{fields.es}}"
            fields:
              - label: "Español"
                name: es
                widget: string
                required: true
              - label: "English"
                name: en
                widget: string
                required: true
          - label: "Dirección de la web (sin barra final)"
            name: siteUrl
            widget: string
            required: false
            hint: "Ahora: https://gorrioncine.github.io · Cuando tengas dominio propio, cámbiala aquí (por ejemplo https://gorrioncine.eu.org)."
          - label: "Enlace del reel (Vimeo / YouTube)"
            name: reelUrl
            widget: string
            required: false
          - label: "Boletín: URL de suscripción (MailerLite)"
            name: newsletterUrl
            widget: string
            required: false
            hint: "Ya viene configurada. Déjala vacía para desactivar el boletín."
          - label: "Buzón de mensajes: dirección del Worker de Cloudflare"
            name: formEndpoint
            widget: string
            required: false
            hint: "La dirección del Worker «gorrion-buzon» (termina en .workers.dev). Los formularios se envían ahí y los lees en Mensajes. Vacío: cada formulario prepara un correo."
          - label: "Turnstile (antispam): clave del sitio"
            name: turnstileSiteKey
            widget: string
            required: false
            hint: "La clave PÚBLICA («Site key») del widget de Cloudflare Turnstile. Empieza por 0x. Vacío: sin verificación antispam."
          - label: "Estadísticas de visitas: código de Cloudflare"
            name: analyticsToken
            widget: string
            required: false
            hint: "Pega aquí el «token» de Cloudflare Web Analytics. Déjalo vacío para no medir visitas."
          - label: "Estadísticas: dirección del Worker de Cloudflare"
            name: statsUrl
            widget: string
            required: false
            hint: "La que te da Cloudflare al crear el Worker (termina en .workers.dev)."
          - label: "Redes sociales"
            name: social
            widget: list
            required: false
            collapsed: true
            summary: "{{fields.name}}"
            label_singular: "red"
            fields:
              - label: "Nombre (Instagram, Vimeo…)"
                name: name
                widget: string
              - label: "Usuario visible"
                name: handle
                widget: string
              - label: "Enlace"
                name: url
                widget: string
          - label: "Canales de mensajería"
            name: channels
            widget: list
            required: false
            collapsed: true
            summary: "{{fields.name}}"
            label_singular: "canal"
            fields:
              - label: "Nombre (Telegram, WhatsApp…)"
                name: name
                widget: string
              - label: "Usuario o número"
                name: handle
                widget: string
      - name: proyectos
        label: "Proyectos"
        file: content/proyectos.json
        fields:
          - label: "Proyectos"
            name: items
            widget: list
            required: false
            collapsed: true
            summary: "{{fields.title}} · {{fields.year}}"
            label_singular: "proyecto"
            fields:
              - label: "Identificador interno (no editable)"
                name: id
                widget: uuid
                hint: "Se genera solo al crear el proyecto y no cambia nunca. Las noticias y los premios se enlazan con él, así que el título se puede cambiar sin romper nada."
                prefix: "proj-"
                readonly: true
                use_b32_encoding: true
              - label: "Título"
                name: title
                widget: string
              - label: "Dirección web (enlace)"
                name: slug
                widget: string
                hint: "Ejemplo: mi-nueva-pelicula. Solo afecta a la dirección de la página del proyecto; si la cambias, los enlaces antiguos a esa página dejan de funcionar."
                pattern: ["^[a-z0-9-]+$", "Solo minúsculas, números y guiones"]
              - label: "Dirección web en inglés (opcional)"
                name: slugEn
                widget: string
                required: false
                hint: "Así se escribe el enlace en la versión inglesa, por ejemplo /en/projects/my-film/. Si lo dejas vacío se usa el mismo que en español."
                pattern: ["^[a-z0-9-]+$", "Solo minúsculas, números y guiones"]
              - label: "Tipo"
                name: type
                widget: select
                options:
                  - { label: "Ficción", value: "ficcion" }
                  - { label: "Documental", value: "documental" }
                  - { label: "Serie web", value: "serie" }
                  - { label: "Videoclip", value: "videoclip" }
                  - { label: "Encargo y publicidad", value: "encargo" }
              - label: "Formato (Cortometraje, Largometraje…)"
                name: format
                widget: object
                required: true
                collapsed: true
                summary: "{{fields.es}}"
                fields:
                  - label: "Español"
                    name: es
                    widget: string
                    required: true
                  - label: "English"
                    name: en
                    widget: string
                    required: true
              - label: "Año"
                name: year
                widget: number
                value_type: "int"
              - label: "Estado"
                name: status
                widget: select
                options:
                  - { label: "En desarrollo", value: "desarrollo" }
                  - { label: "En producción", value: "produccion" }
                  - { label: "En postproducción", value: "postproduccion" }
                  - { label: "Estrenada", value: "estrenado" }
              - label: "Duración"
                name: runtime
                widget: string
                required: false
                hint: "Ejemplo: 18 min"
              - label: "Género"
                name: genre
                widget: object
                required: false
                collapsed: true
                summary: "{{fields.es}}"
                fields:
                  - label: "Español"
                    name: es
                    widget: string
                    required: false
                  - label: "English"
                    name: en
                    widget: string
                    required: false
              - label: "Idioma hablado"
                name: lang
                widget: string
                required: false
              - label: "Subtítulos"
                name: subs
                widget: string
                required: false
              - label: "Destacar en el inicio"
                name: featured
                widget: boolean
                required: false
                hint: "Solo un proyecto debe estar destacado."
                default: false
              - label: "Cartel (imagen vertical)"
                name: poster
                widget: image
                required: false
                hint: "Si no subes cartel, la web genera uno con el título."
              - label: "Frase corta"
                name: tagline
                widget: object
                required: false
                collapsed: true
                summary: "{{fields.es}}"
                fields:
                  - label: "Español"
                    name: es
                    widget: string
                    required: false
                  - label: "English"
                    name: en
                    widget: string
                    required: false
              - label: "Sinopsis corta"
                name: short
                widget: object
                required: true
                collapsed: true
                summary: "{{fields.es}}"
                fields:
                  - label: "Español"
                    name: es
                    widget: text
                    required: true
                  - label: "English"
                    name: en
                    widget: text
                    required: true
              - label: "Sinopsis larga"
                name: long
                widget: object
                required: false
                collapsed: true
                summary: "{{fields.es}}"
                fields:
                  - label: "Español"
                    name: es
                    widget: text
                    required: false
                  - label: "English"
                    name: en
                    widget: text
                    required: false
              - label: "Ficha técnica"
