                  - { label: "Círculo", value: "circle" }
                  - { label: "Franjas", value: "stripes" }
                  - { label: "Triángulo", value: "tri" }
              - label: "Variante del diseño (número, avanzado)"
                name: seed
                widget: number
                required: false
                value_type: "int"
