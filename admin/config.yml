                            widget: string
                            required: false
                  - label: "Enlace"
                    name: url
                    widget: string
                    required: false
                    hint: "Déjalo vacío para que pidan un screener por formulario."
                  - label: "Se pide por screener"
                    name: screener
                    widget: boolean
                    required: false
                    default: false
                  - label: "Se pide el dosier"
                    name: dossier
                    widget: boolean
                    required: false
                    default: false
                  - label: "Enlace interno (avanzado)"
