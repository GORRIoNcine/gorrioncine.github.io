                      - label: "Deutsch"
                        name: de
                        widget: text
                        required: false
              - label: "Sinopsis larga"
                name: long
                widget: object
                required: false
                collapsed: true
                summary: "{{fields.es}}"
                fields:
                  - label: "Español"
                    name: es
                    widget: text
