                summary: "{{fields.r}}: {{fields.n}}"
                label_singular: "persona"
                fields:
                  - label: "Cargo"
                    name: r
                    widget: select
                    options:
                      - { label: "Dirección", value: "direccion" }
                      - { label: "Guion", value: "guion" }
                      - { label: "Producción", value: "produccion" }
                      - { label: "Producción ejecutiva", value: "produccionEj" }
                      - { label: "Fotografía", value: "fotografia" }
                      - { label: "Montaje", value: "montaje" }
                      - { label: "Sonido", value: "sonido" }
                      - { label: "Música", value: "musica" }
                      - { label: "Dirección de arte", value: "arte" }
                      - { label: "Reparto", value: "reparto" }
                      - { label: "Cliente", value: "cliente" }
                  - label: "Nombre(s)"
                    name: n
                    widget: string
