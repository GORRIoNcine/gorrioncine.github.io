                name: a
                widget: object
                required: true
                collapsed: true
                summary: "{{fields.es}}"
                fields:
                  - label: "Español"
                    name: es
                    widget: string
                    required: true
                  - label: "English"
                    name: en
                    widget: string
                    required: true
              - label: "Festival"
                name: f
                widget: string
