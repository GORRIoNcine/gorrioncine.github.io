<noscript><link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:ital,wght@0,500;0,800;1,500;1,800&family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet"></noscript>
<script>(function(){var d=document.documentElement;d.className+=" js";try{var t=localStorage.getItem("tf-theme");if(t!=="dark"&&t!=="light")t=window.matchMedia&&!matchMedia("(prefers-color-scheme: dark)").matches?"light":"dark";d.setAttribute("data-theme",t);var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute("content",t==="light"?"#efefef":"#000000")}catch(e){}setTimeout(function(){d.className+=" late"},9000)})()</script>
<style>:root{color-scheme:light}body{margin:0}
.js .seo{display:none}.late .seo{display:block;position:relative;z-index:9999}.late #boot{display:none}
#boot{position:fixed;inset:0;z-index:9998;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:#000;color:#efefef;font:800 clamp(28px,6vw,44px)/1 "Libre Franklin",Arial,sans-serif;letter-spacing:.02em}
html[data-theme="light"] #boot{background:#efefef;color:#000}
#boot i{display:block;width:120px;height:2px;background:currentColor;opacity:.25;overflow:hidden;position:relative}
#boot i:after{content:"";position:absolute;inset:0;background:currentColor;opacity:1;transform:translateX(-100%);animation:boot 1.1s ease-in-out infinite}
@keyframes boot{to{transform:translateX(100%)}}
@media (prefers-reduced-motion:reduce){#boot i:after{animation:none;transform:none;opacity:.6}}
.seo{background:#000;color:#efefef;font:16px/1.6 "Courier Prime","Courier New",monospace;min-height:100vh;padding:24px}
.seo a{color:#efefef}.seo__h{display:flex;flex-wrap:wrap;gap:16px;align-items:baseline;margin-bottom:32px}
.seo__h nav{display:flex;flex-wrap:wrap;gap:14px}.seo__brand{font:800 28px "Libre Franklin",Arial,sans-serif;text-decoration:none}
.seo__m{max-width:760px}.seo__list{padding-left:18px}.seo__f{margin-top:48px;font-size:14px;opacity:.7}.seo img{max-width:100%;height:auto}
</style>
<link rel="stylesheet" href="/assets/app.css?v={{V}}">
<link rel="stylesheet" href="/assets/home.css?v={{V}}">

<script src="/assets/home.js?v={{V}}" defer></script>
<script src="/assets/app.js?v={{V}}" defer></script>
