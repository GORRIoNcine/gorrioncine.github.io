vana.","Mapa del sitio":"Mapa do site","Síguenos":"Siga-nos","Aviso legal y privacidad":"Aviso legal e privacidade","Todos los derechos reservados.":"Todos os direitos reservados.","Nombres, premios y textos de ejemplo: sustitúyelos en data.js.":"Nomes, prémios e textos de exemplo: substitua-os em data.js.","Titular":"Responsável","GORRIóN, productora audiovisual independiente con sede en La Habana, Cuba. Contacto: ":"GORRIóN, produtora audiovisual independente sediada em Havana, Cuba. Contacto: ","Propiedad intelectual":"Propriedade intelectual","Las películas, textos, imágenes y marcas de este sitio pertenecen a GORRIóN o a sus autores. No pueden reproducirse sin permiso por escrito.":"Os filmes, textos, imagens e marcas deste site pertencem à GORRIóN ou aos seus autores. Não podem ser reproduzidos sem autorização por escrito.","Datos personales":"Dados pessoais","Los datos que escribas en los formularios se usan solo para responder a tu mensaje. No los cedemos a terceros ni los usamos para otros fines. Puedes pedir que los borremos escribiendo al correo de contacto.":"Os dados que escrever nos formulários são usados apenas para responder à sua mensagem. Não os cedemos a terceiros nem os usamos para outros fins. Pode pedir que os apaguemos escrevendo para o e-mail de contacto.","Almacenamiento en tu navegador":"Armazenamento no seu navegador","El sitio guarda en tu navegador únicamente tus preferencias de idioma y de modo ligero. No usa cookies de seguimiento.":"O site guarda no seu navegador apenas as suas preferências de idioma e de modo leve. Não usa cookies de rastreamento.","Esta página no existe":"Esta página não existe","Puede que el enlace esté roto o que el contenido se haya movido.":"Pode ser que o link esteja quebrado ou que o conteúdo tenha mudado de lugar.","Ir al inicio":"Ir para o início","Anterior":"Anterior","Siguiente":"Seguinte","Reel 2026":"Reel 2026"},"it":{"La Habana, Cuba":"L'Avana, Cuba","Ficción":"Finzione","Documental":"Documentario","Serie web":"Serie web","Videoclip":"Videoclip","Encargo y publicidad":"Su commissione e pubblicità","Estrenado":"Uscito","En producción":"In produzione","En desarrollo":"In sviluppo","Dirección":"Regia","Guion":"Sceneggiatura","Producción":"Produzione","Producción ejecutiva":"Produzione esecutiva","Fotografía":"Fotografia","Montaje":"Montaggio","Sonido":"Suono","Música":"Musica","Dirección de arte":"Scenografia","Reparto":"Cast","Cliente":"Cliente","Cortometraje":"Cortometraggio","Drama íntimo":"Dramma intimo","Hay noches que duran lo que un aleteo.":"Ci sono notti che durano quanto un battito d'ali.","Una niña de once años sube cada madrugada a la azotea para seguir a un zunzún que, cree ella, trae noticias de su madre.":"Una bambina di undici anni sale ogni alba sul terrazzo per seguire un colibrì che, secondo lei, porta notizie di sua madre.","Lena vive con su abuelo en un edificio de Centro Habana. Desde que su madre emigró, la azotea se ha convertido en su observatorio: allí espera, antes de que salga el sol, a un zunzún que visita siempre el mismo tendedero. Cuando el ave deja de aparecer, Lena decide seguirla por los techos del barrio y descubre una ciudad que nadie le había enseñado a mirar. Rodada en 16 mm de luz natural y con vecinos del barrio como parte del reparto, la película cuenta una ausencia sin pronunciar nunca la palabra.":"Lena vive con il nonno in un palazzo di Centro Habana. Da quando la madre è emigrata, il terrazzo è diventato il suo osservatorio: lì aspetta, prima che sorga il sole, un colibrì che visita sempre lo stesso filo del bucato. Quando l'uccellino smette di comparire, Lena decide di seguirlo tra i tetti del quartiere e scopre una città che nessuno le aveva insegnato a guardare. Girato in 16 mm con luce naturale e con gli abitanti del quartiere nel cast, il film racconta un'assenza senza mai pronunciarne la parola.","Quería hacer una película sobre alguien que espera sin que la espera sea un lamento. Los techos de La Habana son el único lugar donde una niña puede estar sola y a la vez rodeada de toda la ciudad.":"Volevo fare un film su qualcuno che aspetta senza che l'attesa diventi un lamento. I tetti de L'Avana sono l'unico posto dove una bambina può essere sola e allo stesso tempo circondata da tutta la città.","Estreno mundial":"Anteprima mondiale","Premio del Público · Cortometraje":"Premio del Pubblico · Cortometraggio","Selección oficial":"Selezione ufficiale","Un corto que mira hacia arriba y lo ve todo.":"Un corto che guarda in alto e vede tutto.","Delicadeza rara en el cine de hoy.":"Una delicatezza rara nel cinema di oggi.","Tráiler":"Trailer","Vimeo · 1 min 40 s":"Vimeo · 1 min 40 s","Ver la película":"Guarda il film","Disponible bajo petición (screener)":"Disponibile su richiesta (screener)","Largometraje":"Lungometraggio","Documental de observación":"Documentario di osservazione","La ciudad despierta de cara al mar.":"La città si sveglia di fronte al mare.","Pescadores, barrenderos, corredores y enamorados al borde del muro durante los noventa minutos en que el Malecón cambia de turno.":"Pescatori, spazzini, runner e innamorati sul bordo del muro durante i novanta minuti in cui il Malecón cambia turno.","Durante once meses, un equipo de cuatro personas filmó cada amanecer en el mismo tramo del Malecón habanero. Sin entrevistas ni voz en off, la película se arma con lo que el muro ve cuando casi nadie lo mira: el pescador que lleva treinta años en el mismo escalón, la brigada que lava la acera antes del primer sol, la pareja que se despide sin saber si será por mucho tiempo. Un retrato coral de la ciudad a esa hora en que todavía no ha decidido quién va a ser hoy.":"Per undici mesi, una troupe di quattro persone ha filmato ogni alba nello stesso tratto del Malecón dell'Avana. Senza interviste né voce fuori campo, il film si costruisce con ciò che il muro vede quando quasi nessuno lo guarda: il pescatore che da trent'anni siede sullo stesso gradino, la squadra che lava il marciapiede prima del primo sole, la coppia che si saluta senza sapere se sarà per molto tempo. Un ritratto corale della città all'ora in cui non ha ancora deciso chi sarà oggi.","No buscábamos explicar el Malecón. Queríamos quedarnos el tiempo suficiente para que dejara de ser un lugar y se volviera una costumbre.":"Non cercavamo di spiegare il Malecón. Volevamo restare abbastanza a lungo perché smettesse di essere un luogo e diventasse un'abitudine.","Estreno internacional":"Anteprima internazionale","Mejor Fotografía Documental":"Miglior Fotografia Documentaria","Proyección especial":"Proiezione speciale","Observa sin invadir y por eso lo dice todo.":"Osserva senza invadere e per questo dice tutto.","Vimeo · 2 min":"Vimeo · 2 min","Solicitar proyección":"Richiedi una proiezione","Cineclubes, universidades y festivales":"Cineclub, università e festival","Serie web · 8 × 12 min":"Serie web · 8 × 12 min","Comedia costumbrista":"Commedia di costume","En la cola se cuenta todo, menos lo que de verdad importa.":"Nella fila si racconta tutto, tranne ciò che conta davvero.","Ocho episodios en una misma cuadra, una misma bodega y una cola que lo sabe todo de todos.":"Otto episodi nello stesso isolato, nella stessa bottega e con una fila che sa tutto di tutti.","Cada episodio ocurre durante la espera del pan de la mañana. En doce minutos y en tiempo casi real, los vecinos de una cuadra de Santos Suárez se enteran de bodas, se pelean por turnos, negocian favores y descubren que el dependiente guarda un secreto. La serie combina actores profesionales con vecinos y está pensada para verse en el móvil, incluso con conexión limitada.":"Ogni episodio si svolge durante l'attesa del pane del mattino. In dodici minuti e quasi in tempo reale, i vicini di un isolato di Santos Suárez vengono a sapere di matrimoni, litigano per i turni, si scambiano favori e scoprono che il commesso custodisce un segreto. La serie unisce attori professionisti e abitanti del quartiere ed è pensata per essere vista sul cellulare, anche con connessione limitata.","Fin de la escritura":"Fine della scrittura","Inicio del rodaje":"Inizio delle riprese","Seguir el rodaje":"Segui le riprese","Diario de rodaje en Noticias":"Diario di set nelle Notizie","Comedia coral":"Commedia corale","Cuando se apaga la luz, se encienden los vecinos.":"Quando salta la luce, si accendono i vicini.","Una noche, un edificio y once familias obligadas a salir al portal a conversar.":"Una notte, un palazzo e undici famiglie costrette a uscire sul portone a chiacchierare.","Un edificio de cuatro plantas se queda a oscuras la noche de una boda, un cumpleaños y una discusión pendiente. A la luz de las velas, los vecinos sacan al portal sillas, rencores y la mitad de una receta. Una comedia coral sobre cómo se habita junto a los demás. El proyecto se encuentra en desarrollo y busca coproductores.":"Un palazzo di quattro piani resta al buio la notte di un matrimonio, di un compleanno e di una discussione in sospeso. Alla luce delle candele, i vicini portano sul portone sedie, rancori e metà di una ricetta. Una commedia corale su come si abita accanto agli altri. Il progetto è in sviluppo e cerca coproduttori.","Seleccionado para pitch":"Selezionato per il pitch","Coproducción":"Coproduzione","Dosier y tratamiento disponibles":"Dossier e trattamento disponibili","Mediometraje":"Mediometraggio","Documental poético":"Documentario poetico","Un pueblo que aprendió a oír el silencio de su fábrica.":"Un paese che ha imparato ad ascoltare il silenzio della sua fabbrica.","Un pueblo y su antiguo central azucarero, entre la memoria de la zafra y lo que se hace hoy con sus ruinas.":"Un paese e il suo vecchio zuccherificio, tra la memoria della raccolta e ciò che oggi si fa delle sue rovine.","Los obreros que quedan recorren las naves del central como quien visita a un familiar. Los hijos usan el batey para jugar béisbol, y los camiones que pasan por la carretera ya no se detienen. Con archivo familiar y sonido directo, el documental escucha cómo cambia la relación de un pueblo con el lugar que le dio nombre.":"Gli operai rimasti percorrono i capannoni dello zuccherificio come chi va a trovare un parente. I figli usano il piazzale per giocare a baseball, e i camion che passano sulla strada non si fermano più. Con archivio di famiglia e presa diretta, il documentario ascolta come cambia il rapporto di un paese con il luogo che gli ha dato il nome.","Estreno":"Anteprima","Mención especial del jurado":"Menzione speciale della giuria","El sonido hace lo que las imágenes no se atreven.":"Il suono fa ciò che le immagini non osano.","Ver completo":"Guarda per intero","Vimeo · acceso libre":"Vimeo · accesso libero","Musical":"Musical","Una banda, una azotea y tres cámaras.":"Una band, un terrazzo e tre camere.","Plano secuencia sobre los techos para el tema de Los Hijos del Aguacero.":"Piano sequenza sui tetti per il brano di Los Hijos del Aguacero.","Tres cámaras y un solo plano secuencia sobre una azotea de El Cerro, con la banda tocando en directo mientras el vecindario aparece en cada balcón. Grabado en una tarde, con luz de atardecer y un ensayo previo de cuatro días.":"Tre camere e un unico piano sequenza su un terrazzo di El Cerro, con la band che suona dal vivo mentre il vicinato compare a ogni balcone. Girato in un pomeriggio, con la luce del tramonto e quattro giorni di prove.","Estreno en línea":"Anteprima online","Ver el videoclip":"Guarda il videoclip","YouTube":"YouTube","Película institucional":"Film istituzionale","Institucional":"Istituzionale","El café también tiene a quién agradecerle.":"Anche il caffè ha qualcuno da ringraziare.","Película para la Cooperativa Cafetalera Loma Alta sobre el camino del grano, de la mata a la taza.":"Un film per la Cooperativa Cafetalera Loma Alta sul viaggio del chicco, dalla pianta alla tazza.","Rodaje de tres días en la montaña con las familias de la cooperativa. Entregamos una versión de tres minutos para exhibición en ferias y cuatro piezas verticales para redes sociales, con subtítulos en español e inglés.":"Tre giorni di riprese in montagna con le famiglie della cooperativa. Abbiamo consegnato una versione di tre minuti per le fiere e quattro pezzi verticali per i social, con sottotitoli in spagnolo e inglese.","Ver la pieza":"Guarda il video","Vimeo":"Vimeo","Spot publicitario":"Spot pubblicitario","Publicidad":"Pubblicità","Cuarenta y cinco segundos de dulce.":"Quarantacinque secondi di dolcezza.","Spot de 45 segundos para una marca artesanal de dulces de guayaba.":"Spot di 45 secondi per un marchio artigianale di dolci alla guaiava.","Concepto, guion, rodaje y posproducción de un spot para una marca artesanal de dulces. Una sola localización, luz natural y un presupuesto contenido, resuelto con cámara en mano y un montaje de ritmo ágil.":"Concept, sceneggiatura, riprese e postproduzione di uno spot per un marchio artigianale di dolci. Una sola location, luce naturale e un budget contenuto, risolti con camera a mano e un montaggio dal ritmo agile.","Ver el spot":"Guarda lo spot","Premio del Público":"Premio del Pubblico","GORRIóN y el cine que mira desde la azotea":"GORRIóN e il cinema che guarda dal terrazzo","Perfil de la productora tras el estreno de La Hora del Zunzún.":"Profilo della casa di produzione dopo l'anteprima di La Hora del Zunzún.","Cinco cortos latinoamericanos para seguir de cerca":"Cinque corti latinoamericani da tenere d'occhio","La Hora del Zunzún entre las recomendaciones del festival.":"La Hora del Zunzún tra i consigli del festival.","Entrevista a Rolando Béquer sobre Malecón, 6 a.m.":"Intervista a Rolando Béquer su Malecón, 6 a.m.","Cómo se filma el mismo amanecer durante once meses.":"Come si filma la stessa alba per undici mesi.","La Hora del Zunzún gana el Premio del Público":"La Hora del Zunzún vince il Premio del Pubblico","El corto de Ana Lía Cordero se llevó el voto del público en la Muestra Joven del Sur.":"Il corto di Ana Lía Cordero ha conquistato il voto del pubblico alla Muestra Joven del Sur.","El cortometraje La Hora del Zunzún recibió el Premio del Público en la Muestra Joven del Sur, tras proyectarse en tres sesiones con la sala llena.":"Il cortometraggio La Hora del Zunzún ha ricevuto il Premio del Pubblico alla Muestra Joven del Sur, dopo tre proiezioni a sala piena.","Para el equipo es un reconocimiento compartido con los vecinos de Centro Habana que participaron en el rodaje. En los próximos meses la película viajará a otros festivales de la región.":"Per la squadra è un riconoscimento condiviso con gli abitanti di Centro Habana che hanno partecipato alle riprese. Nei prossimi mesi il film viaggerà in altri festival della regione.","Si eres programador o programadora y quieres ver la película, puedes solicitar un enlace privado desde la ficha del proyecto.":"Se sei un programmatore o una programmatrice e vuoi vedere il film, puoi richiedere un link privato dalla scheda del progetto.","Diario de rodaje: primer día de Pan de Bodega":"Diario di set: primo giorno di Pan de Bodega","Cinco de la mañana, una cola de cuarenta personas y una cámara que no se nota.":"Le cinque del mattino, una fila di quaranta persone e una camera che non si nota.","Empezamos a las cinco, antes de que abriera la bodega. La idea era sencilla: que la cola real y la cola ficticia se confundieran hasta que nadie supiera quién actuaba y quién esperaba su pan.":"Abbiamo cominciato alle cinque, prima che aprisse la bottega. L'idea era semplice: far confondere la fila vera e quella finta, finché nessuno avrebbe saputo chi recitava e chi aspettava il suo pane.","Los vecinos de la cuadra nos recibieron con café y con una lista de cosas que, según ellos, no podían faltar en la serie. Casi todas entraron al guion.":"I vicini dell'isolato ci hanno accolto con il caffè e con una lista di cose che, secondo loro, non potevano mancare nella serie. Quasi tutte sono entrate nella sceneggiatura.","Hoy grabamos el segundo episodio. Iremos publicando aquí el diario de cada semana.":"Oggi giriamo il secondo episodio. Pubblicheremo qui il diario di ogni settimana.","Convocatoria: buscamos equipo para la temporada de rodajes":"Open call: cerchiamo troupe per la stagione delle riprese","Asistentes de cámara, sonidistas, producción y arte para proyectos de 2026 y 2027.":"Assistenti operatore, fonici, produzione e scenografia per i progetti del 2026 e del 2027.","Abrimos una convocatoria para sumar personas a los equipos de producción, cámara, sonido y arte. No se exige experiencia previa en cine, pero sí ganas de aprender en rodajes reales.":"Apriamo una open call per aggiungere persone ai team di produzione, camera, suono e scenografia. Non serve alcuna esperienza precedente nel cinema, ma la voglia di imparare su set veri sì.","Escríbenos a través del formulario de contacto eligiendo el motivo «Colaboración», cuéntanos qué sabes hacer y adjunta un enlace a algún trabajo si lo tienes.":"Scrivici dal modulo di contatto scegliendo il motivo «Collaborazione», raccontaci cosa sai fare e allega il link a un tuo lavoro, se ce l'hai.","Detrás de cámaras: once meses frente al mismo muro":"Dietro le quinte: undici mesi di fronte allo stesso muro","Cómo se rodó Malecón, 6 a.m. con un equipo de cuatro personas y una sola cámara.":"Come è stato girato Malecón, 6 a.m. con una troupe di quattro persone e una sola camera.","Rodar cada día en el mismo sitio exige disciplina y paciencia: a veces el amanecer no regala nada y hay que volver al día siguiente.":"Girare ogni giorno nello stesso posto richiede disciplina e pazienza: a volte l'alba non regala nulla e bisogna tornare il giorno dopo.","El equipo trabajó con una cámara, dos ópticas fijas y un grabador de sonido. Gran parte de la película nació de lo que ocurrió cuando ya habíamos decidido recoger los trípodes.":"La troupe ha lavorato con una camera, due ottiche fisse e un registratore audio. Gran parte del film è nata da ciò che è successo quando avevamo già deciso di raccogliere i treppiedi.","Taller abierto de montaje documental":"Workshop aperto di montaggio documentario","Cuatro sesiones con Lisandra Fuentes para aprender a montar sin guion previo.":"Quattro sessioni con Lisandra Fuentes per imparare a montare senza sceneggiatura preventiva.","Lisandra Fuentes, montadora de la productora, imparte un taller de cuatro sesiones sobre cómo encontrar la película dentro del material. Los cupos son limitados.":"Lisandra Fuentes, montatrice della casa di produzione, tiene un workshop di quattro sessioni su come trovare il film dentro il girato. I posti sono limitati.","Estrenos":"Uscite","Rodajes":"Riprese","Convocatorias":"Open call","Detrás de cámaras":"Dietro le quinte","Diseñamos y financiamos el proyecto contigo, de la idea a la entrega.":"Progettiamo e finanziamo il progetto insieme a te, dall'idea alla consegna.","Plan de producción y presupuesto":"Piano di produzione e budget","Búsqueda de fondos y coproducción":"Ricerca di fondi e coproduzione","Gestión de permisos y locaciones":"Gestione di permessi e location","Contratos y derechos":"Contratti e diritti","Producción de campo para rodajes internacionales":"Fixing per riprese internazionali","Somos tu equipo local si vienes a filmar a Cuba.":"Siamo la tua squadra locale se vieni a filmare a Cuba.","Fixers y traducción":"Fixer e traduzione","Búsqueda de locaciones":"Ricerca di location","Casting local":"Casting locale","Logística y seguridad en rodaje":"Logistica e sicurezza sul set","Dirección y fotografía":"Regia e fotografia","Ficción, documental y piezas de marca con mirada de autor.":"Finzione, documentario e pezzi di brand con sguardo d'autore.","Desarrollo de guion y tratamiento":"Sviluppo di sceneggiatura e trattamento","Dirección de fotografía":"Direzione della fotografia","Equipos ligeros para rodar en cualquier lugar":"Attrezzatura leggera per girare ovunque","Dron y estabilizadores":"Drone e stabilizzatori","Posproducción":"Postproduzione","Montaje, color y sonido hechos por l petta.","Documentalista. Cree que una película se encuentra tras volver muchas veces al mismo sitio.":"Documentarista. Crede che un film si trovi tornando molte volte nello stesso posto.","Pone el dinero, los permisos y las fechas en el mismo plano. Lleva la relación con coproductores.":"Mette soldi, permessi e date nella stessa inquadratura. Segue i rapporti con i coproduttori.","Trabaja con luz natural y equipos ligeros. Rodó casi todo lo que ves en este sitio.":"Lavora con luce naturale e attrezzatura leggera. Ha girato quasi tutto ciò che vedi in questo sito.","Montaje y dirección":"Montaggio e regia","Monta documental y ficción. Dirige videoclips y da talleres de montaje.":"Monta documentari e finzione. Dirige videoclip e tiene workshop di montaggio.","Graba el sonido directo y diseña el sonido de cada película. Sabe cómo suena una azotea.":"Registra il suono in presa diretta e progetta il sound design di ogni film. Sa che suono ha un terrazzo.","Mirar de cerca":"Guardare da vicino","Historias del barrio, la cuadra y la familia, filmadas con paciencia y sin postal.":"Storie del quartiere, dell'isolato e della famiglia, filmate con pazienza e senza cartolina.","Equipos pequeños":"Troupe piccole","Pocas personas, mucho oficio. Así llegamos a lugares donde un gran equipo no cabe.":"Poche persone, tanto mestiere. Così arriviamo dove una grande troupe non entra.","Hecho con la gente":"Fatto con la gente","Vecinos en el reparto, locaciones prestadas, premios compartidos.":"Vicini nel cast, location prestate, premi condivisi.","Cine independiente":"Cinema indipendente","Elegimos qué contar y con quién. Financiamos con fondos, coproducciones y encargos.":"Scegliamo cosa raccontare e con chi. Ci finanziamo con fondi, coproduzioni e commissioni.","Nace GORRIóN":"Nasce GORRIóN","Cuatro amigos, una cámara prestada y una azotea del Vedado.":"Quattro amici, una camera in prestito e un terrazzo del Vedado.","Primeros encargos":"Le prime commissioni","Videoclips y películas institucionales que financian los proyectos propios.":"Videoclip e film istituzionali che finanziano i nostri progetti.","Sal y Cañaveral":"Sal y Cañaveral","Primer documental con selección internacional.":"Primo documentario con una selezione internazionale.","Malecón, 6 a.m.":"Malecón, 6 a.m.","Nuestro primer largometraje.":"Il nostro primo lungometraggio.","Pan de Bodega":"Pan de Bodega","Empieza el rodaje de nuestra primera serie.":"Iniziano le riprese della nostra prima serie.","GORRIóN es una productora audiovisual independiente con sede en La Habana. Desde 2018 produce ficción, documental, series y videoclips con equipos pequeños y una mirada cercana a la vida cotidiana. Sus películas se han presentado en festivales de América Latina.":"GORRIóN è una casa di produzione audiovisiva indipendente con sede a L'Avana. Dal 2018 produce finzione, documentari, serie e videoclip con troupe piccole e uno sguardo ravvicinato sulla vita quotidiana. I suoi film sono stati presentati in festival dell'America Latina.","Saltar al contenido":"Vai al contenuto","Proyectos":"Progetti","Servicios":"Servizi","Nosotros":"Chi siamo","Prensa":"Stampa","Noticias":"Notizie","Contacto":"Contatti","Menú":"Menu","Cerrar":"Chiudi","Buscar":"Cerca","Modo ligero":"Modalità leggera","Menos animaciones y gráficos, para conexiones lentas":"Meno animazioni e grafica, per connessioni lente","Idioma":"Lingua","Negro":"Nero","Blanco":"Bianco","Rojo":"Rosso","Cine <i class=\"lc\">independiente</i> hecho en <span class=\"hl\">Cuba</span>.":"Cinema <i class=\"lc\">indipendente</i> fatto a <span class=\"hl\">Cuba</span>.","Título, nombre, tema…":"Titolo, nome, tema…","Busca entre proyectos y noticias.":"Cerca tra progetti e notizie.","No hay resultados para":"Nessun risultato per","Productora audiovisual independiente · La Habana":"Casa di produzione audiovisiva indipendente · L'Avana","Hacemos ficción, documental, series y videoclips con equipos pequeños y mucha calle. Producimos nuestros proyectos y los de quienes quieren filmar en Cuba.":"Facciamo finzione, documentari, serie e videoclip con troupe piccole e tanta strada. Produciamo i nostri progetti e quelli di chi vuole girare a Cuba.","Ver proyectos":"Vedi i progetti","Ver el reel":"Guarda il reel","Ficción, documental, series y más":"Finzione, documentari, serie e altro","Producción, rodaje y posproducción":"Produzione, riprese e postproduzione","Cuéntanos tu proyecto":"Raccontaci il tuo progetto","Estreno destacado":"Uscita in evidenza","Ver ficha":"Vedi scheda","Ver tráiler":"Guarda il trailer","Selección de <u>proyectos</u>":"Selezione di <u>progetti</u>","Ver todos":"Vedi tutti","Premios y selecciones":"Premi e selezioni","Quiénes somos":"Chi siamo","Equipos <b>pequeños</b>, historias <u>grandes</u>.":"Troupe <b>piccole</b>, storie <u>grandi</u>.","GORRIóN nació en 2018 en una azotea del Vedado. Producimos cine que mira de cerca la vida cotidiana: la cola de la bodega, el muro del Malecón, el vecino que sube a ver el cielo. Trabajamos con fondos, coproducciones y encargos, y decidimos nosotros qué contar.":"GORRIóN è nata nel 2018 su un terrazzo del Vedado. Produciamo cinema che guarda da vicino la vita quotidiana: la fila della bottega, il muro del Malecón, il vicino che sale a guardare il cielo. Lavoriamo con fondi, coproduzioni e commissioni, e siamo noi a decidere cosa raccontare.","Conocer al equipo":"Conosci il team","Últimas <u>noticias</u>":"Ultime <u>notizie</u>","Todas las noticias":"Tutte le notizie","¿Tienes un <u>proyecto</u>? Hablemos.":"Hai un <u>progetto</u>? Parliamone.","Cuéntanos la idea y te respondemos en uno o dos días.":"Raccontaci l'idea e ti rispondiamo in uno o due giorni.","Escribir a la productora":"Scrivi alla casa di produzione","Catálogo":"Catalogo","Películas, documentales, series, videoclips y encargos. Filtra por tipo, estado o año.":"Film, documentari, serie, videoclip e commissioni. Filtra per tipo, stato o anno.","Tipo":"Tipo","Estado":"Stato","Año":"Anno","Todos":"T i modalità leggera. Non usa cookie di tracciamento.","Esta página no existe":"Questa pagina non esiste","Puede que el enlace esté roto o que el contenido se haya movido.":"Il link potrebbe essere errato o il contenuto potrebbe essere stato spostato.","Ir al inicio":"Vai alla home","Anterior":"Precedente","Siguiente":"Successivo","Reel 2026":"Reel 2026"},"de":{"La Habana, Cuba":"Havanna, Kuba","Ficción":"Spielfilm","Documental":"Dokumentarfilm","Serie web":"Webserie","Videoclip":"Musikvideo","Encargo y publicidad":"Auftragsarbeiten & Werbung","Estrenado":"Uraufgeführt","En producción":"In Produktion","En desarrollo":"In Entwicklung","Dirección":"Regie","Guion":"Drehbuch","Producción":"Produktion","Producción ejecutiva":"Ausführende Produktion","Fotografía":"Kamera","Montaje":"Schnitt","Sonido":"Ton","Música":"Musik","Dirección de arte":"Szenenbild","Reparto":"Besetzung","Cliente":"Kunde","Cortometraje":"Kurzfilm","Drama íntimo":"Intimes Drama","Hay noches que duran lo que un aleteo.":"Es gibt Nächte, die so lange dauern wie ein Flügelschlag.","Una niña de once años sube cada madrugada a la azotea para seguir a un zunzún que, cree ella, trae noticias de su madre.":"Ein elfjähriges Mädchen steigt jeden Morgen vor Sonnenaufgang aufs Dach, um einem Zunzún zu folgen, der ihrer Überzeugung nach Nachricht von ihrer Mutter bringt.","Lena vive con su abuelo en un edificio de Centro Habana. Desde que su madre emigró, la azotea se ha convertido en su observatorio: allí espera, antes de que salga el sol, a un zunzún que visita siempre el mismo tendedero. Cuando el ave deja de aparecer, Lena decide seguirla por los techos del barrio y descubre una ciudad que nadie le había enseñado a mirar. Rodada en 16 mm de luz natural y con vecinos del barrio como parte del reparto, la película cuenta una ausencia sin pronunciar nunca la palabra.":"Lena lebt mit ihrem Großvater in einem Haus in Centro Habana. Seit ihre Mutter ausgewandert ist, ist das Dach ihr Observatorium: Dort wartet sie, noch bevor die Sonne aufgeht, auf einen Zunzún, der immer dieselbe Wäscheleine besucht. Als der Vogel nicht mehr kommt, beschließt Lena, ihm über die Dächer des Viertels zu folgen, und entdeckt eine Stadt, die ihr nie jemand zu sehen beigebracht hat. Gedreht auf 16 mm bei natürlichem Licht und mit Nachbarn aus dem Viertel in der Besetzung, erzählt der Film von einer Abwesenheit, ohne das Wort je auszusprechen.","Quería hacer una película sobre alguien que espera sin que la espera sea un lamento. Los techos de La Habana son el único lugar donde una niña puede estar sola y a la vez rodeada de toda la ciudad.":"Ich wollte einen Film über jemanden machen, der wartet, ohne dass das Warten zur Klage wird. Die Dächer von Havanna sind der einzige Ort, an dem ein Mädchen allein sein kann und zugleich von der ganzen Stadt umgeben ist.","Estreno mundial":"Weltpremiere","Premio del Público · Cortometraje":"Publikumspreis · Kurzfilm","Selección oficial":"Offizielle Auswahl","Un corto que mira hacia arriba y lo ve todo.":"Ein Kurzfilm, der nach oben schaut und alles sieht.","Delicadeza rara en el cine de hoy.":"Eine seltene Zartheit im Kino von heute.","Tráiler":"Trailer","Vimeo · 1 min 40 s":"Vimeo · 1 Min. 40 Sek.","Ver la película":"Film ansehen","Disponible bajo petición (screener)":"Auf Anfrage verfügbar (Screener)","Largometraje":"Langfilm","Documental de observación":"Beobachtender Dokumentarfilm","La ciudad despierta de cara al mar.":"Die Stadt erwacht mit Blick aufs Meer.","Pescadores, barrenderos, corredores y enamorados al borde del muro durante los noventa minutos en que el Malecón cambia de turno.":"Fischer, Straßenkehrer, Läufer und Verliebte an der Mauer, in den neunzig Minuten, in denen am Malecón die Schicht wechselt.","Durante once meses, un equipo de cuatro personas filmó cada amanecer en el mismo tramo del Malecón habanero. Sin entrevistas ni voz en off, la película se arma con lo que el muro ve cuando casi nadie lo mira: el pescador que lleva treinta años en el mismo escalón, la brigada que lava la acera antes del primer sol, la pareja que se despide sin saber si será por mucho tiempo. Un retrato coral de la ciudad a esa hora en que todavía no ha decidido quién va a ser hoy.":"Elf Monate lang filmte ein vierköpfiges Team jeden Sonnenaufgang am selben Abschnitt des Malecón von Havanna. Ohne Interviews und ohne Off-Stimme setzt sich der Film aus dem zusammen, was die Mauer sieht, wenn kaum jemand hinschaut: der Fischer, der seit dreißig Jahren auf derselben Stufe steht, die Brigade, die den Gehweg vor der ersten Sonne wäscht, das Paar, das sich verabschiedet, ohne zu wissen, ob für lange. Ein vielstimmiges Porträt der Stadt zu der Stunde, in der sie noch nicht entschieden hat, wer sie heute sein wird.","No buscábamos explicar el Malecón. Queríamos quedarnos el tiempo suficiente para que dejara de ser un lugar y se volviera una costumbre.":"Wir wollten den Malecón nicht erklären. Wir wollten so lange bleiben, bis er aufhörte, ein Ort zu sein, und zur Gewohnheit wurde.","Estreno internacional":"Internationale Premiere","Mejor Fotografía Documental":"Beste Dokumentarfilm-Kamera","Proyección especial":"Sondervorführung","Observa sin invadir y por eso lo dice todo.":"Er beobachtet, ohne einzudringen, und sagt gerade deshalb alles.","Vimeo · 2 min":"Vimeo · 2 Min.","Solicitar proyección":"Vorführung anfragen","Cineclubes, universidades y festivales":"Filmclubs, Universitäten und Festivals","Serie web · 8 × 12 min":"Webserie · 8 × 12 Min.","Comedia costumbrista":"Sittenkomödie","En la cola se cuenta todo, menos lo que de verdad importa.":"In der Schlange wird alles erzählt, nur nicht das, worauf es wirklich ankommt.","Ocho episodios en una misma cuadra, una misma bodega y una cola que lo sabe todo de todos.":"Acht Folgen in demselben Häuserblock, derselben Bodega und einer Schlange, die alles über alle weiß.","Cada episodio ocurre durante la espera del pan de la mañana. En doce minutos y en tiempo casi real, los vecinos de una cuadra de Santos Suárez se enteran de bodas, se pelean por turnos, negocian favores y descubren que el dependiente guarda un secreto. La serie combina actores profesionales con vecinos y está pensada para verse en el móvil, incluso con conexión limitada.":"Jede Folge spielt während des Wartens aufs Morgenbrot. In zwölf Minuten und beinahe in Echtzeit erfahren die Nachbarn eines Häuserblocks in Santos Suárez von Hochzeiten, streiten um ihre Reihenfolge, handeln Gefälligkeiten aus und entdecken, dass der Verkäufer ein Geheimnis hütet. Die Serie verbindet Berufsschauspieler mit Nachbarn und ist dafür gemacht, auf dem Handy geschaut zu werden, auch bei schlechter Verbindung.","Fin de la escritura":"Drehbuch abgeschlossen","Inicio del rodaje":"Drehstart","Seguir el rodaje":"Den Dreh verfolgen","Diario de rodaje en Noticias":"Drehtagebuch unter Neuigkeiten","Comedia coral":"Ensemblekomödie","Cuando se apaga la luz, se encienden los vecinos.":"Wenn das Licht ausgeht, gehen die Nachbarn an.","Una noche, un edificio y once familias obligadas a salir al portal a conversar.":"Eine Nacht, ein Haus und elf Familien, die gezwungen sind, zum Plaudern vor die Tür zu gehen.","Un edificio de cuatro plantas se queda a oscuras la noche de una boda, un cumpleaños y una discusión pendiente. A la luz de las velas, los vecinos sacan al portal sillas, rencores y la mitad de una receta. Una comedia coral sobre cómo se habita junto a los demás. El proyecto se encuentra en desarrollo y busca coproductores.":"Ein vierstöckiges Haus liegt in der Nacht einer Hochzeit, eines Geburtstags und eines überfälligen Streits im Dunkeln. Im Kerzenschein tragen die Nachbarn Stühle, Groll und das halbe Rezept auf die Veranda. Eine Ensemblekomödie darüber, wie man Seite an Seite mit anderen wohnt. Das Projekt befindet sich in Entwicklung und sucht Koproduzenten.","Seleccionado para pitch":"Für Pitch ausgewählt","Coproducción":"Koproduktion","Dosier y tratamiento disponibles":"Dossier und Treatment verfügbar","Mediometraje":"Mittellanger Film","Documental poético":"Poetischer Dokumentarfilm","Un pueblo que aprendió a oír el silencio de su fábrica.":"Ein Dorf, das gelernt hat, die Stille seiner Fabrik zu hören.","Un pueblo y su antiguo central azucarero, entre la memoria de la zafra y lo que se hace hoy con sus ruinas.":"Ein Dorf und seine alte Zuckerfabrik, zwischen der Erinnerung an die Ernte und dem, was heute mit ihren Ruinen geschieht.","Los obreros que quedan recorren las naves del central como quien visita a un familiar. Los hijos usan el batey para jugar béisbol, y los camiones que pasan por la carretera ya no se detienen. Con archivo familiar y sonido directo, el documental escucha cómo cambia la relación de un pueblo con el lugar que le dio nombre.":"Die verbliebenen Arbeiter gehen durch die Hallen der Fabrik wie durch den Besuch bei einem Verwandten. Die Kinder spielen auf dem Fabrikhof Baseball, und die Lastwagen auf der Landstraße halten schon lange nicht mehr an. Mit Familienarchiv und Originalton hört der Dokumentarfilm, wie sich die Beziehung eines Dorfes zu dem Ort wandelt, der ihm seinen Namen gab.","Estreno":"Premiere","Mención especial del jurado":"Besondere Erwähnung der Jury","El sonido hace lo que las imágenes no se atreven.":"Der Ton tut, was sich die Bilder nicht trauen.","Ver completo":"Ganz ansehen","Vimeo · acceso libre":"Vimeo · frei zugänglich","Musical":"Musical","Una banda, una azotea y tres cámaras.":"Eine Band, ein Dach und drei Kameras.","Plano secuencia sobre los techos para el tema de Los Hijos del Aguacero.":"Plansequenz über den Dächern für den Song von Los Hijos del Aguacero.","Tres cámaras y un solo plano secuencia sobre una azotea de El Cerro, con la banda tocando en directo mientras el vecindario aparece en cada balcón. Grabado en una tarde, con luz de atardecer y un ensayo previo de cuatro días.":"Drei Kameras und eine einzige Plansequenz auf einem Dach in El Cerro: Die Band spielt live, während die Nachbarschaft auf jedem Balkon erscheint. An einem Nachmittag aufgenommen, bei Abendlicht und nach einer viertägigen Probe.","Estreno en línea":"Online-Premiere","Ver el videoclip":"Musikvideo ansehen","YouTube":"YouTube","Película institucional":"Imagefilm","Institucional":"Corporate","El café también tiene a quién agradecerle.":"Auch der Kaffee hat jemanden, dem er danken kann.","Película para la Cooperativa Cafetalera Loma Alta sobre el camino del grano, de la mata a la taza.":"Film für die Cooperativa Cafetalera Loma Alta über den Weg der Bohne, von der Pflanze bis zur Tasse.","Rodaje de tres días en la montaña con las familias de la cooperativa. Entregamos una versión de tres minutos para exhibición en ferias y cuatro piezas verticales para redes sociales, con subtítulos en español e inglés.":"Dreitägiger Dreh in den Bergen mit den Familien der Kooperative. Wir lieferten eine dreiminütige Fassung für Messen und vier vertikale Beiträge für soziale Netzwerke, mit spanischen und englischen Untertiteln.","Ver la pieza":"Beitrag ansehen","Vimeo":"Vimeo","Spot publicitario":"Werbespot","Publicidad":"Werbung","Cuarenta y cinco segundos de dulce.":"Fünfundvierzig Sekunden Süße.","Spot de 45 segundos para una marca artesanal de dulces de guayaba.":"45-Sekunden-Spot für eine handwerkliche Marke von Guaven-Süßwaren.","Concepto, guion, rodaje y posproducción de un spot para una marca artesanal de dulces. Una sola localización, luz natural y un presupuesto contenido, resuelto con cámara en mano y un montaje de ritmo ágil.":"Konzept, Drehbuch, Dreh und Postproduktion eines Spots für eine handwerkliche Süßwarenmarke. Ein einziger Drehort, natürliches Licht und ein knappes Budget, gelöst mit Handkamera und einem Schnitt im flotten Rhythmus.","Ver el spot":"Spot ansehen","Premio del Público":"Publikumspreis","GORRIóN y el cine que mira desde la azotea":"GORRIóN und das Kino, das vom Dach aus schaut","Perfil de la productora tras el estreno de La Hora del Zunzún.":"Porträt der Produktionsfirma nach der Premiere von La Hora del Zunzún.","Cinco cortos latinoamericanos para seguir de cerca":"Fünf lateinamerikanische Kurzfilme, die man im Auge behalten sollte","La Hora del Zunzún entre las recomendaciones del festival.":"La Hora del Zunzún unter den Empfehlungen des Festivals.","Entrevista a Rolando Béquer sobre Malecón, 6 a.m.":"Interview mit Rolando Béquer über Malecón, 6 a.m.","Cómo se filma el mismo amanecer durante once meses.":"Wie man elf Monate lang denselben Sonnenaufgang filmt.","La Hora del Zunzún gana el Premio del Público":"La Hora del Zunzún gewinnt den Publikumspreis","El corto de Ana Lía Cordero se llevó el voto del público en la Muestra Joven del Sur.":"Der Kurzfilm von Ana Lía Cordero gewann die Stimmen des Publikums bei der Muestra Joven del Sur.","El cortometraje La Hora del Zunzún recibió el Premio del Público en la Muestra Joven del Sur, tras proyectarse en tres sesiones con la sala llena.":"Der Kurzfilm La Hora del Zunzún erhielt bei der Muestra Joven del Sur den Publikumspreis, nachdem er in drei ausverkauften Vorstellungen gezeigt worden war.","Para el equipo es un reconocimiento compartido con los vecinos de Centro Habana que participaron en el rodaje. En los próximos meses la película viajará a otros festivales de la región.":"Für das Team ist es eine Anerkennung, die es mit den Nachbarn aus Centro Habana teilt, die am Dreh beteiligt waren. In den kommenden Monaten wird der Film zu weiteren Festivals der Region reisen.","Si eres programador o programadora y quieres ver la película, puedes solicitar un enlace privado desde la ficha del proyecto.":"Wenn Sie Programmplaner oder Programmplanerin sind und den Film sehen möchten, können Sie auf der Projektseite einen privaten Link anfordern.","Diario de rodaje: primer día de Pan de Bodega":"Drehtagebuch: erster Tag von Pan de Bodega","Cinco de la mañana, una cola de cuarenta personas y una cámara que no se nota.":"Fünf Uhr morgens, eine Schlange von vierzig Personen und eine Kamera, die man nicht bemerkt.","Empezamos a las cinco, antes de que abriera la bodega. La idea era sencilla: que la cola real y la cola ficticia se confundieran hasta que nadie supiera quién actuaba y quién esperaba su pan.":"Wir fingen um fünf an, noch bevor die Bodega öffnete. Die Idee war einfach: Die echte und die gespielte Schlange sollten ineinander übergehen, bis niemand mehr wusste, wer spielte und wer auf sein Brot wartete.","Los vecinos de la cuadra nos recibieron con café y con una lista de cosas que, según ellos, no podían faltar en la serie. Casi todas entraron al guion.":"Die Nachbarn des Häuserblocks empfingen uns mit Kaffee und mit einer Liste von Dingen, die ihrer Meinung nach in der Serie nicht fehlen durften. Fast alle haben es ins Drehbuch geschafft.","Hoy grabamos el segundo episodio. Iremos publicando aquí el diario de cada semana.":"Heute drehen wir die zweite Folge. Das Tagebuch jeder Woche veröffentlichen wir hier.","Convocatoria: buscamos equipo para la temporada de rodajes":"Aufruf: Wir suchen Verstärkung für die Drehsaison","Asistentes de cámara, sonidistas, producción y arte para proyectos de 2026 y 2027.":"Kameraassistenz, Tonleute, Produktion und Ausstattung für Projekte 2026 und 2027.","Abrimos una convocatoria para sumar personas a los equipos de producción, cámara, sonido y arte. No se exige experiencia previa en cine, pero sí ganas de aprender en rodajes reales.":"Wir rufen dazu auf, die Teams in Produktion, Kamera, Ton und Ausstattung zu verstärken. Vorherige Filmerfahrung ist nicht erforderlich, wohl aber Lust, bei echten Drehs zu lernen.","Escríbenos a través del formulario de contacto eligiendo el motivo «Colaboración», cuéntanos qué sabes hacer y adjunta un enlace a algún trabajo si lo tienes.":"Schreiben Sie uns über das Kontaktformular, wählen Sie den Anlass „Zusammenarbeit“, erzählen Sie uns, was Sie können, und fügen Sie, falls vorhanden, einen Link zu einer Arbeitsprobe bei.","Detrás de cámaras: once meses frente al mismo muro":"Hinter den Kulissen: elf Monate vor derselben Mauer","Cómo se rodó Malecón, 6 a.m. con un equipo de cuatro personas y una sola cámara.":"Wie Malecón, 6 a.m. mit einem vierköpfigen Team und nur einer Kamera entstand.","Rodar cada día en el mismo sitio exige disciplina y paciencia: a veces el amanecer no regala nada y hay que volver al día siguiente.":"Jeden Tag am selben Ort zu drehen verlangt Disziplin und Geduld: Manchmal schenkt der Sonnenaufgang nichts, und man muss am nächsten Tag wiederkommen.","El equipo trabajó con una cámara, dos ópticas fijas y un grabador de sonido. Gran parte de la película nació de lo que ocurrió cuando ya habíamos decidido recoger los trípodes.":"Das Team arbeitete mit einer Kamera, zwei Festbrennweiten und einem Tonaufnahmegerät. Ein großer Teil des Films entstand aus dem, was geschah, als wir schon beschlossen hatten, die Stative einzupacken.","Taller abierto de montaje documental":"Offener Workshop zum Dokumentarfilmschnitt","Cuatro sesiones con Lisandra Fuentes para aprender a montar sin guion previo.":"Vier Sitzungen mit Lisandra Fuentes, um ohne vorheriges Drehbuch zu schneiden.","Lisandra Fuentes, montadora de la productora, imparte un taller de cuatro sesiones sobre cómo encontrar la película dentro del material. Los cupos son limitados.":"Lisandra Fuentes, Editorin der Produktionsfirma, leitet einen Workshop mit vier Sitzungen darüber, wie man den Film im Material findet. Die Plätze sind begrenzt.","Estrenos":"Premieren","Rodajes":"Dreharbeiten","Convocatorias":"Aufrufe","Detrás de cámaras":"Hinter den Kulissen","Diseñamos y financiamos el proyecto contigo, de la idea a la entrega.":"Wir konzipieren und finanzieren das Projekt gemeinsam mit Ihnen, von der Idee bis zur Auslieferung.","Plan de producción y presupuesto":"Produktionsplan und Budget","Búsqueda de fondos y coproducción":"Mittelakquise und Koproduktion","Gestión de permisos y locaciones":"Drehgenehmigungen und Locations","Contratos y derechos":"Verträge und Rechte","Producción de campo    ARTE: logotipos de GORRIóN, carteles, fotogramas y retratos generados en SVG.
   Paleta estricta: negro #000000, blanco #efefef, rojo #5f140f (y mezclas entre ellos para dar profundidad).
   Para usar imágenes reales, añade el campo `poster` (ruta o data: URI) a un proyecto en data.js.
   ========================================================================== */

const INK = "#000000", BONE = "#efefef", RED = "#5f140f";
const MID = "#2f0a07"; // mezcla 50 % negro + rojo, para sombras
let _uid = 0;

function rng(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

/* ---------- Reglas tipográficas de marca ----------
   Como en el nombre GORRIóN: todo en mayúsculas salvo la letra acentuada, que va en minúscula.
   Las palabras de enlace (de, del, y, en, the, of…) se ponen en minúscula cursiva. */
const CONNECT = new Set(["de", "del", "la", "las", "el", "los", "y", "en", "a", "con", "por", "the", "of", "in", "and", "to", "for", "on", "at", "du", "des", "le", "les", "et", "à", "au", "aux", "sur", "dans", "da", "do", "dos", "das", "o", "os", "as", "e", "em", "no", "na", "nos", "nas", "il", "lo", "gli", "di", "della", "dei", "delle", "al", "alla", "nel", "nella", "per", "und", "der", "die", "das", "dem", "den", "von", "aus", "mit", "für", "zu", "am", "im", "auf", "an"]);
const ACC_RE = /[áéíóúüñàâäçèêëîïôöûùãõœæÁÉÍÓÚÜÑÀÂÄÇÈÊËÎÏÔÖÛÙÃÕ]/g;
function brandWords(title) {
  return title.split(/\s+/).filter(Boolean).map((w, i) => {
    const core = w.replace(/[.,:;!?¿¡"“”]/g, "").toLowerCase();
    if (i > 0 && CONNECT.has(core)) return { t: w.toLowerCase(), it: true };
    return { t: w.toUpperCase().replace(ACC_RE, (c) => c.toLowerCase()), it: false };
  });
}
function brandifyDOM(root) {
  root.querySelectorAll("h1, h2, h3, h4").forEach((h) => {
    let first = true;
    const w = document.createTreeWalker(h, NodeFilter.SHOW_TEXT), nodes = [];
    while (w.nextNode()) nodes.push(w.currentNode);
    nodes.forEach((n) => {
      if (n.parentElement && n.parentElement.closest(".lc")) { first = false; return; }
      const parts = n.nodeValue.split(/(\s+)/);
      let changed = false;
      const html = parts.map((tok) => {
        if (!tok || /^\s+$/.test(tok)) return esc(tok);
        const core = tok.replace(/[.,:;!?¿¡"“”]/g, "").toLowerCase();
        let out;
        if (!first && CONNECT.has(core)) { changed = true; out = `<i class="lc">${esc(tok)}</i>`; }
        else out = esc(tok).replace(ACC_RE, (c) => { changed = true; return `<span class="lc">${c.toLowerCase()}</span>`; });
        first = false; return out;
      }).join("");
      if (changed) { const s = document.createElement("span"); s.innerHTML = html; n.replaceWith(...s.childNodes); }
    });
  });
}

/* Cabeceras de página: primeros planos (recortes) del gorrión del hero y del segundo gorrión, con animaciones simples. */
function headArt(seed = 0) {
  const v = Math.abs(seed | 0) % 3;
  let fence = "";
  for (let i = -2; i < 12; i++) fence += `<path d="M${i * 70} 90V340" stroke="#000" stroke-opacity=".5" stroke-width="3"/>`;
  let holes = "";
  for (let i = 0; i < 10; i++) holes += `<rect x="${18 + i * 40}" y="10" width="14" height="14" fill="#efefef" fill-opacity=".55"/><rect x="${18 + i * 40}" y="376" width="14" height="14" fill="#efefef" fill-opacity=".55"/>`;
  const g = `ph${v}`;
  const bg = `<rect width="400" height="400" fill="#000"/><polygon points="90,0 260,0 400,180 400,330 0,330 0,110" fill="url(#${g}r)"/><g class="bd-fence"><g>${fence}<path d="M0 200H1200" stroke="#000" stroke-opacity=".5" stroke-width="3"/></g></g><rect y="330" width="400" height="70" fill="#1c1c1c"/>`;
  let art;
  if (v === 0) art = `<g transform="scale(.95) translate(-150 -196)"><g transform="translate(1080 0) scale(-1 1)">${birdPaths("bd-body")}</g></g>`;
  else if (v === 1) art = `<g transform="translate(46 4) scale(.36) translate(-190 -20)">${bird2Paths()}</g>`;
  else art = `<g transform="scale(.8) translate(-470 -210)">${birdPaths("bd-body")}</g>`;
  return `<svg viewBox="0 0 400 400" aria-hidden="true"><defs><linearGradient id="${g}r" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#000"/><stop offset=".35" stop-color="${MID}"/><stop offset=".75" stop-color="${RED}"/><stop offset="1" stop-color="#7d1c12"/></linearGradient><clipPath id="${g}c"><rect width="400" height="400"/></clipPath></defs>
  <g clip-path="url(#${g}c)">${bg}${art}</g><rect x="1" y="1" width="398" height="398" fill="none" stroke="#efefef" stroke-opacity=".35" stroke-width="2"/>${holes}</svg>`;
}

/* ---------- Carteles generados 2:3 ---------- */
function posterLines(title, maxChars) {
  const words = brandWords(title), lines = [[]];
  words.forEach((w) => {
    const cur = lines[lines.length - 1], len = cur.reduce((a, x) => a + x.t.length + 1, 0) + w.t.length;
    if (!cur.length || len <= maxChars) cur.push(w); else lines.push([w]);
  });
  return lines.slice(0, 4);
}
function posterSVG(p, lang) {
  if (p.poster) return `<img src="${esc(p.poster)}" alt="" loading="lazy" style="width:100%;height:100%;object-fit:cover">`;
  const R = rng(p.seed * 97 + hashStr(p.slug) % 1000), g = uid("pg");
  const lines = posterLines(p.title, 10);
  const longest = Math.max(...lines.map((l) => l.reduce((a, x) => a + x.t.length + 1, -1)));
  const fs = Math.min(76, Math.floor(330 / (longest * 0.66)));
  const lh = fs * 0.92, yEnd = 518, yStart = yEnd - (lines.length - 1) * lh;
  let art = "";
  const sx = 120 + R() * 160;
  switch (p.style) {
    case "rays": {
      let ray = "";

      break;
    }
    case "diamond":
      art = `<polygon points="${sx.toFixed(0)},40 ${(sx + 190).toFixed(0)},230 ${sx.toFixed(0)},420 ${(sx - 190).toFixed(0)},230" fill="${RED}"/><polygon points="${sx.toFixed(0)},40 ${(sx + 190).toFixed(0)},230 ${sx.toFixed(0)},230" fill="${MID}"/><polygon points="${(sx + 20).toFixed(0)},70 ${(sx + 200).toFixed(0)},250 ${(sx + 20).toFixed(0)},430 ${(sx - 160).toFixed(0)},250" fill="none" stroke="${BONE}" stroke-width="2"/><line x1="0" y1="${(100 + R() * 80).toFixed(0)}" x2="400" y2="${(300 + R() * 80).toFixed(0)}" stroke="${BONE}" stroke-opacity=".8"/>`;
      break;
    case "stripes": {
      let s = "";
      for (let i = 0; i < 6; i++) { const x = -120 + i * 80 + R() * 30, w = 20 + R() * 50; s += `<polygon points="${(x + 220).toFixed(0)},0 ${(x + 220 + w).toFixed(0)},0 ${(x + w).toFixed(0)},470 ${x.toFixed(0)},470" fill="${i % 3 === 1 ? BONE : i % 2 ? RED : MID}" fill-opacity="${i % 3 === 1 ? ".9" : "1"}"/>`; }
      art = `${s}<circle cx="${(290 - R() * 60).toFixed(0)}" cy="${(120 + R() * 60).toFixed(0)}" r="34" fill="${BONE}"/>`;
      break;
    }
    case "circle":
      art = `<circle cx="${sx.toFixed(0)}" cy="250" r="140" fill="${BONE}"/><rect x="0" y="250" width="400" height="${(60 + R() * 40).toFixed(0)}" fill="${RED}"/><rect x="0" y="${(330 + R() * 20).toFixed(0)}" width="400" height="8" fill="${INK}"/><circle cx="${sx.toFixed(0)}" cy="250" r="154" fill="none" stroke="${BONE}" stroke-opacity=".5" stroke-dasharray="2 12" stroke-width="8"/>`;
      break;
    default:
      art = `<polygon points="0,110 ${(230 + R() * 100).toFixed(0)},430 0,430" fill="${RED}"/><polygon points="0,110 ${(230 + R() * 100).toFixed(0)},430 380,300 0,60" fill="${MID}" opacity=".8"/><polygon points="400,0 400,200 250,0" fill="${BONE}"/><line x1="0" y1="${(200 + R() * 60).toFixed(0)}" x2="400" y2="${(380 + R() * 60).toFixed(0)}" stroke="${BONE}"/>`;
  }
  const tl = L(TYPES[p.type]);
  const tspans = lines.map((l, i) => `<text x="28" y="${(yStart + i * lh).toFixed(0)}" font-size="${fs}" fill="${BONE}" style="font-family:var(--f-display);font-weight:500;letter-spacing:.01em">${l.map((w, j) => (j ? " " : "") + (w.it ? `<tspan font-style="italic">${esc(w.t)}</tspan>` : esc(w.t))).join("")}</text>`).join("");
  let holes = ""; for (let i = 0; i < 13; i++) holes += `<rect x="${14 + i * 30}" y="578" width="10" height="10" fill="${BONE}" fill-opacity=".55"/>`;
  return `<svg viewBox="0 0 400 600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="${esc(p.title)}">
  <defs><linearGradient id="${g}f" x1="0" y1="0" x2="0" y2="1"><stop offset=".5" stop-color="${INK}" stop-opacity="0"/><stop offset=".82" stop-color="${INK}" stop-opacity=".95"/></linearGradient></defs>

  ${holes}</svg>`;
}

/* ---------- Fotogramas 2.39:1 (de ejemplo) ---------- */
function stillSVG(seed, idx) {
  const R = rng(seed * 31 + idx * 17 + 5), g = uid("sg");
  const hz = 100 + R() * 40;
  let far = "", near = "", x = 0;
  while (x < 478) { const w = 14 + R() * 38, h = 20 + R() * 54; far += `<rect x="${x.toFixed(0)}" y="${(hz - h).toFixed(0)}" width="${w.toFixed(0)}" height="${h.toFixed(0)}" fill="${MID}"/>`; x += w + R() * 6; }
  x = -10;
  while (x < 478) { const w = 30 + R() * 70, h = 26 + R() * 60, y = 200 - h; near += `<rect x="${x.toFixed(0)}" y="${y.toFixed(0)}" width="${w.toFixed(0)}" height="${h.toFixed(0)}" fill="${INK}"/>`; if (R() > .5) near += `<rect x="${(x + w * .3).toFixed(0)}" y="${(y - 14).toFixed(0)}" width="${(w * .3).toFixed(0)}" height="14" fill="${INK}"/>`; x += w + R() * 4; }
  const sunX = 60 + R() * 360, mode = idx % 3;
  const sun = mode === 1 ? `<circle cx="${sunX.toFixed(0)}" cy="${(hz - 22).toFixed(0)}" r="${(24 + R() * 20).toFixed(0)}" fill="${BONE}"/>` : `<circle cx="${sunX.toFixed(0)}" cy="${(hz - 10).toFixed(0)}" r="${(30 + R() * 26).toFixed(0)}" fill="${mode === 2 ? BONE : RED}" ${mode === 2 ? 'fill-opacity=".85"' : ""}/>`;
  let stars = "";
  for (let i = 0; i < 9; i++) stars += `<circle cx="${(R() * 478).toFixed(0)}" cy="${(R() * 60).toFixed(0)}" r="${(R() * 1.2 + .4).toFixed(1)}" fill="${BONE}" fill-opacity=".7"/>`;
  return `<svg viewBox="0 0 478 200" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><linearGradient id="${g}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${mode === 1 ? INK : MID}"/><stop offset=".62" stop-color="${mode === 1 ? MID : RED}"/><stop offset="1" stop-color="${INK}"/></linearGradient></defs>
  <rect width="478" height="200" fill="url(#${g})"/>${stars}${sun}${far}${near}
  <line x1="0" y1="${(30 + R() * 40).toFixed(0)}" x2="478" y2="${(40 + R() * 40).toFixed(0)}" stroke="${BONE}" stroke-opacity=".3"/></svg>`;
}

/* ---------- Retratos geométricos (de ejemplo) ---------- */
function avatarSVG(name, seed) {
  const R = rng(seed * 13 + 7), ini = name.split(" ").map((w) => w[0]).slice(0, 2).join("");
  const bgs = [RED, INK, BONE, MID], bg = bgs[seed % 4], fg = bg === BONE ? INK : BONE, alt = bg === RED || bg === MID ? INK : RED;
  const sh = [];
  sh.push(`<polygon points="0,200 ${(60 + R() * 80).toFixed(0)},${(40 + R() * 40).toFixed(0)} 200,${(100 + R() * 60).toFixed(0)} 200,200" fill="${alt}"/>`);
  sh.push(`<circle cx="${(40 + R() * 120).toFixed(0)}" cy="${(40 + R() * 40).toFixed(0)}" r="${(16 + R() * 20).toFixed(0)}" fill="${fg}"/>`);
  sh.push(`<line x1="0" y1="${(R() * 200).toFixed(0)}" x2="200" y2="${(R() * 200).toFixed(0)}" stroke="${fg}" stroke-opacity=".5"/>`);
  return `<svg viewBox="0 0 200 200" role="img" aria-label="${esc(name)}"><rect width="200" height="200" fill="${bg}"/>${sh.join("")}<text x="14" y="184" font-size="62" fill="${fg}" style="font-family:var(--f-display);font-weight:500">${esc(ini)}</text></svg>`;
}

/* ==========================================================================
   EFECTOS DE SCROLL "ESCRIBIENDO UN GUION"
   - El texto de títulos y párrafos se escribe letra a letra según se baja y se borra al subir
     (scrub: el progreso depende de la posición, no del tiempo). Un cursor parpadea donde se escribe.
   - Entre secciones aparecen rótulos de escena (ESC. INT./EXT.) y transiciones (CORTE A:), como en un guion.
   - Tarjetas y bloques entran con un fundido y un "telón" que depende del sentido del scroll.
   - Contador de página (PÁG. n/N) y barra de progreso.
   Todo lo que está en la primera pantalla se muestra completo al cargar. Se desactiva con

const FX = (() => {
  const mq = window.matchMedia ? window.matchMedia("(prefers-reduced-motion: reduce)") : { matches: false };
  const SLUGS = {
    es: ["INT. SALA DE PROYECCIÓN — NOCHE", "EXT. AZOTEA — ATARDECER", "INT. CUARTO DE MONTAJE — MADRUGADA", "EXT. MALECÓN — AMANECER", "INT. ESTUDIO — DÍA", "EXT. LA CUADRA — TARDE"],
    en: ["INT. SCREENING ROOM — NIGHT", "EXT. ROOFTOP — DUSK", "INT. EDITING ROOM — EARLY MORNING", "EXT. MALECÓN — DAWN", "INT. STUDIO — DAY", "EXT. THE BLOCK — AFTERNOON"],
    fr: ["INT. SALLE DE PROJECTION — NUIT", "EXT. TOIT-TERRASSE — CRÉPUSCULE", "INT. SALLE DE MONTAGE — PETIT MATIN", "EXT. MALECÓN — AUBE", "INT. STUDIO — JOUR", "EXT. LE QUARTIER — APRÈS-MIDI"],
    pt: ["INT. SALA DE PROJEÇÃO — NOITE", "EXT. TERRAÇO — ENTARDECER", "INT. SALA DE MONTAGEM — MADRUGADA", "EXT. MALECÓN — AMANHECER", "INT. ESTÚDIO — DIA", "EXT. O QUARTEIRÃO — TARDE"],
    it: ["INT. SALA DI PROIEZIONE — NOTTE", "EXT. TERRAZZA — TRAMONTO", "INT. SALA DI MONTAGGIO — NOTTE FONDA", "EXT. MALECÓN — ALBA", "INT. STUDIO — GIORNO", "EXT. L'ISOLATO — POMERIGGIO"],
    de: ["INT. VORFÜHRRAUM — NACHT", "EXT. DACHTERRASSE — ABENDDÄMMERUNG", "INT. SCHNITTRAUM — FRÜHER MORGEN", "EXT. MALECÓN — MORGENGRAUEN", "INT. STUDIO — TAG", "EXT. DER HÄUSERBLOCK — NACHMITTAG"]
  };
  const CUT = { es: "CORTE A:", en: "CUT TO:", fr: "COUPE SUR :", pt: "CORTE PARA:", it: "STACCO SU:", de: "SCHNITT AUF:" };
  const OUT = { es: "FUNDIDO A NEGRO.", en: "FADE OUT.", fr: "FONDU AU NOIR.", pt: "FADE OUT.", it: "DISSOLVENZA IN NERO.", de: "ABBLENDE." };
  const PG = { es: "PÁG.", en: "PAGE", fr: "PAGE", pt: "PÁG.", it: "PAG.", de: "SEITE" };
  const TEXT_SEL = "main h1, main h2, main .lede, main .hero__sub, main .tagline, main .prose p, main .quote, .scene .slug, .scene .cut";
  const RV_SEL = ".card, .nitem, .svc__i, .values > div, .step, .person, .laurel, .where, .tl, .still, .kit__i, .press a, .press .pr";
  let items = [], io = null, enabled = false, ticking = false, lastY = 0, cursorEl = null, pager = null, bound = false;
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const html = document.documentElement;

  function split(el) {
    const text = el.textContent, chars = [];
    const walk = (node) => {
      Array.from(node.childNodes).forEach((n) => {
        if (n.nodeType === 3) {
          const frag = document.createDocumentFragment();
          n.nodeValue.split(/(\s+)/).forEach((tok) => {
            if (!tok) return;
            if (/^\s+$/.test(tok)) { frag.appendChild(document.createTextNode(tok)); return; }
            const w = document.createElement("span");
            w.className = "w"; w.setAttribute("aria-hidden", "true");
            Array.from(tok).forEach((c) => { const s = document.createElement("span"); s.className = "ch"; s.textContent = c; w.appendChild(s); chars.push(s); });
            frag.appendChild(w);
          });
          n.replaceWith(frag);
        } else if (n.nodeType === 1) walk(n);
      });
    };
    walk(el);
    const sr = document.createElement("span"); sr.className = "sr"; sr.textContent = text; el.prepend(sr);
    return chars;
  }

  function addScenes(root) {
    const L = SLUGS[lang] ? lang : "en";
    const secs = Array.from(root.querySelectorAll("main > section")).filter((s) => !s.classList.contains("hero") && !s.classList.contains("dock"));
    secs.forEach((s, i) => {
      const w = s.querySelector(":scope > .wrap"); if (!w) return;
      const d = document.createElement("div");
      d.className = "wrap scene"; d.setAttribute("aria-hidden", "true");
      d.innerHTML = `<span class="slug">${i + 1}. ${esc(SLUGS[L][i % SLUGS[L].length])}</span><span class="cut">${CUT[L]}</span>`;
      s.insertBefore(d, w);
    });
    const foot = root.querySelector(".foot");
    if (foot && foot.firstElementChild) {
      const d = document.createElement("div");
      d.className = "wrap scene scene--out"; d.setAttribute("aria-hidden", "true");

      foot.insertBefore(d, foot.firstElementChild);

  function frame() {
    ticking = false;
    const y = window.scrollY, vh = window.innerHeight;
    const dy = y - lastY;
    if (Math.abs(dy) > 1) { html.dataset.dir = dy > 0 ? "down" : "up"; lastY = y; }
    const max = Math.max(1, html.scrollHeight - vh);
    html.style.setProperty("--prog", clamp(y / max, 0, 1).toFixed(4));
    html.style.setProperty("--hy", Math.min(y * 0.12, 140).toFixed(1) + "px");
    if (pager) {
      const total = Math.max(1, Math.ceil(html.scrollHeight / vh)), page = clamp(Math.floor((y + vh * 0.5) / vh) + 1, 1, total);
      pager.firstChild.textContent = `${PG[PG[lang] ? lang : "en"]} ${String(page).padStart(2, "0")}/${String(total).padStart(2, "0")}`;
    }
    let cur = null;
    for (const it of items) {
      const r = it.el.getBoundingClientRect();
      let p;
      if (r.top > vh * 1.1) p = 0;
      else if (r.bottom < -vh * 0.1) p = 1;
      else p = clamp((vh * 0.9 - r.top) / (Math.min(r.height, vh * 0.45) + vh * 0.14), 0, 1);
      const n = Math.round(p * it.chars.length);
      if (n !== it.n) {
        const a = Math.min(n, it.n), b = Math.max(n, it.n), on = n > it.n;
        for (let i = a; i < b; i++) it.chars[i].classList.toggle("on", on);
        it.n = n;
      }
      if (n > 0 && r.top < vh * 0.95 && r.bottom > 0) cur = it;
    }
    const ce = cur ? cur.chars[cur.n - 1] : null;
    if (ce !== cursorEl) { if (cursorEl) cursorEl.classList.remove("cur"); if (ce) ce.classList.add("cur"); cursorEl = ce; }
  }
  function onScroll() { if (enabled && !ticking) { ticking = true; requestAnimationFrame(frame); } }

  function init(root) {
    if (io) { io.disconnect(); io = null; }
    items = []; cursorEl = null;
    enabled = !lite && !mq.matches && "IntersectionObserver" in window;
    html.classList.toggle("fx", enabled);
    if (!bound) {
      bound = true;
      window.addEventListener("scroll", onScroll, { passive: true });
      window.addEventListener("resize", onScroll);
    }
    if (!enabled) { if (pager) pager.hidden = true; return; }
    if (!pager) {
      pager = document.createElement("div"); pager.className = "pager"; pager.setAttribute("aria-hidden", "true");
      pager.innerHTML = "<span></span><i><b></b></i>"; document.body.appendChild(pager);
    }
    pager.hidden = false;
    addScenes(root);
    const vh = window.innerHeight, sy = window.scrollY;
    const docTop = (el) => el.getBoundingClientRect().top + sy;

    /* Texto: solo se escribe lo que queda debajo de la primera pantalla */
    root.querySelectorAll(TEXT_SEL).forEach((el) => {
      if (el.closest(".card, .nitem, .notice, .sdlg")) return;
      if (docTop(el) < vh * 0.9) return;
      const chars = split(el);
      if (chars.length) items.push({ el, chars, n: 0 });
    });

    /* Bloques: fundido y telón según el sentido del scroll */
    io = new IntersectionObserver((es) => es.forEach((e) => e.target.classList.toggle("in", e.isIntersecting)), { rootMargin: "0px 0px -6% 0px", threshold: 0.06 });
    root.querySelectorAll(RV_SEL).forEach((el) => {
      if (docTop(el) < vh * 0.9) return;
      const sibs = Array.from(el.parentElement.children).filter((c) => c.matches(RV_SEL));
      el.style.setProperty("--i", String(Math.max(0, sibs.indexOf(el)) % 4));
      el.classList.add("rv");
      io.observe(el);
    });
    frame();
  }
  return { init };
})();

/* ==========================================================================
   GORRIÓN COMPAÑERO
   - Hero: el gorrión sigue el scroll con retardo (lerp), se inclina y se encoge un poco.
   - Al llegar al final de la página vuela a la esquina inferior derecha, se hace pequeño y
     "habla" en un globo de texto con la acción de contacto. Al subir de nuevo, se va.
   ========================================================================== */
const Buddy = (() => {
  let el = null, bound = false, on = false, dismissed = false, s = 0, target = 0, raf = 0, tIn = 0, tOut = 0;
  const html = document.documentElement;
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

  function build() {
    el = document.createElement("aside");
    el.className = "buddy"; el.id = "buddy";
    document.body.appendChild(el);
    el.addEventListener("click", (e) => {
      if (e.target.closest("[data-buddy-x]")) { talk(false); return; }
      const b = e.target.closest(".buddy__bird");
      if (b) { b.classList.remove("hop"); void b.offsetWidth; b.classList.add("hop"); talk(true); }
    });
  }
  /* El globo habla un rato y se desvanece; un clic en el gorrión lo vuelve a sacar. */
  function talk(v, delay) {
    clearTimeout(tIn); clearTimeout(tOut);
    const go = () => {
      el.classList.toggle("talk", v);
      if (v) tOut = setTimeout(() => el.classList.remove("talk"), 5200);
    };
    if (v && delay) tIn = setTimeout(go, delay); else go();
  }
  function fill() {
    el.innerHTML = `<div class="buddy__bubble" role="group" aria-label="${esc(t("buddy_t"))}"><button class="buddy__x" type="button" data-buddy-x aria-label="${esc(t("buddy_x"))}">×</button><p>${esc(t("buddy_t"))}</p><a class="btn btn--red" href="#contacto">${esc(t("buddy_b"))} ${ICONS.arrow}</a></div><button class="buddy__bird" type="button" aria-label="${esc(t("buddy_t"))}">${buddyBird()}</button>`;
  }
  function setOn(v) {
    if (v === on) return;
    on = v; el.classList.toggle("on", v); html.classList.toggle("buddy-on", v);
    if (v) { el.removeAttribute("inert"); talk(true, 1000); } else { el.setAttribute("inert", ""); talk(false); }
  }
  function heroTarget() {
    const h = document.querySelector(".hero");
    if (!h) return 0;
    return clamp(window.scrollY / Math.max(1, h.offsetHeight), 0, 1);
  }
  function tick() {
    raf = 0;
    s += (target - s) * 0.07;
    const art = document.querySelector(".hero__art svg");
    if (art) {
      art.style.setProperty("--by", (s * 110).toFixed(1) + "px");
      art.style.setProperty("--br", (s * -6).toFixed(2) + "deg");
      art.style.setProperty("--bsc", (1 - s * 0.14).toFixed(3));
    }
    if (Math.abs(target - s) > 0.002) raf = requestAnimationFrame(tick);
  }
  function onScroll() {
    const vh = window.innerHeight, y = window.scrollY;
    const hero = document.querySelector(".hero");
    /* Inicio: el gorrión vuela a la esquina al terminar el hero. Resto de páginas: ya está en la esquina, sin vuelo. */
    const past = hero ? y >= hero.offsetTop + hero.offsetHeight - vh * 0.3 : true;
    el.classList.toggle("static", !hero);
    setOn(past && location.hash !== "#contacto");
    if (html.classList.contains("fx") || true) {
      target = heroTarget();
      if (!raf) raf = requestAnimationFrame(tick);
    }
  }
  function sync() {
    if (!el) build();
    fill();
    if (!bound) { bound = true; window.addEventListener("scroll", onScroll, { passive: true }); window.addEventListener("resize", onScroll); }
    on = !on; setOn(!on); // fuerza estado coherente tras re-render
    s = 0; target = 0;
    const art = document.querySelector(".hero__art svg");
    if (art) { art.style.removeProperty("--by"); art.style.removeProperty("--br"); art.style.removeProperty("--bsc"); }
    onScroll();
  }
  return { sync };
})();

/* ---------- Estado ---------- */
const LANGS = [{ c: "es", n: "Español" }, { c: "en", n: "English" }, { c: "fr", n: "Français" }, { c: "pt", n: "Português" }, { c: "it", n: "Italiano" }, { c: "de", n: "Deutsch" }];
/* Idioma automático: recorre las preferencias del navegador en orden (es-CU, en-US, fr…) y toma la primera disponible;
   catalán/gallego/vasco → español; cualquier otro idioma → inglés. Si el visitante elige idioma en el selector, esa elección manda. */
function detectLang() {
  try {
    const prefs = (navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || ""]);
    for (const p of prefs) {
      const c = String(p).slice(0, 2).toLowerCase();
      if (LANGS.some((l) => l.c === c)) return c;
      if (["ca", "gl", "eu", "oc", "ast"].includes(c)) return "es";
    }
    return prefs.some((p) => p) ? "en" : "es";
  } catch (e) { return "es"; }
}
let lang = "es", lite = false;
try {
  const sl = localStorage.getItem("tf-lang"), sf = localStorage.getItem("tf-lite");
  lang = LANGS.some((l) => l.c === sl) ? sl : detectLang();
  if (sf === "1") lite = true;
} catch (e) { /* sin almacenamiento */ }
const F = { type: "all", status: "all", year: "all", q: "" };
let newsCat = "all";

/* Traducción: es y en viven junto al texto; fr, pt, it y de salen del diccionario TR (clave = texto en español). Si falta, se usa inglés. */
const trs = (es, en) => (typeof TR !== "undefined" && TR[lang] && TR[lang][es] !== undefined ? TR[lang][es] : en !== undefined ? en : es);
const t = (k) => {
  const a = S[k]; if (!a) return k;
  if (lang === "es") return a[0];
  if (lang === "en") return a[1];
  return Array.isArray(a[0]) ? a[0].map((s, i) => trs(s, a[1][i])) : trs(a[0], a[1]);
};
const L = (o) => {
  if (o === null || o === undefined) return "";
  if (typeof o !== "object" || Array.isArray(o)) return o;
  if (o[lang] !== undefined && o[lang] !== "" && !(Array.isArray(o[lang]) && !o[lang].length)) return o[lang];
  if (o.otros && o.otros[lang] !== undefined && o.otros[lang] !== "" && !(Array.isArray(o.otros[lang]) && !o.otros[lang].length)) return o.otros[lang];
  return Array.isArray(o.es) ? o.es.map((s, i) => trs(s, (o.en || [])[i])) : trs(o.es, o.en);
};
const norm = (s) => String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
/* Los proyectos se enlazan por su id permanente (proj-…). Por compatibilidad, projBy también acepta un slug antiguo.
   Devuelve undefined si no existe: quien lo use debe comprobarlo. */
const projBy = (ref) => (ref ? PROJECTS.find((p) => p.id === ref) || PROJECTS.find((p) => p.slug === ref) : undefined);
const projName = (ref) => { const p = projBy(ref); return p ? p.title : ""; };

function fmtDate(d) {
  const p = d.split("-").map(Number);
  const dt = new Date(Date.UTC(p[0], (p[1] || 1) - 1, p[2] || 1));
  const o = { timeZone: "UTC", year: "numeric" };
  if (p[1]) o.month = "long";
  if (p[2]) o.day = "numeric";
  return new Intl.DateTimeFormat(lang, o).format(dt);
}

function fld(id, label, o = {}) {
  const type = o.type || "text", req = o.req ? " required" : "";

    ? `<textarea class="field" id="${id}" name="${o.name || id}" rows="${o.rows || 5}"${req}${o.ph ? ` placeholder="${esc(o.ph)}"` : ""}></textarea>`
    : `<input class="field" id="${id}" name="${o.name || id}" type="${type}"${req}${ac}${o.ph ? ` placeholder="${esc(o.ph)}"` : ""}>`;
  return `<label class="lbl" for="${id}">${esc(label)}${inner}</label>`;
}

/* ---------- Enrutador ---------- */
function parseRoute() {
  const h = decodeURIComponent((location.hash || "").replace(/^#/, ""));
  if (!h || h === "inicio") return { name: "inicio" };
  if (h.startsWith("p-")) { const p = projBy(h.slice(2)); return p ? { name: "project", p } : { name: "404" }; }
  if (h.startsWith("n-")) { const n = NEWS.find((x) => x.slug === h.slice(2)); return n ? { name: "article", n } : { name: "404" }; }
  if (["proyectos", "servicios", "nosotros", "prensa", "noticias", "contacto", "legal"].includes(h)) return { name: h };
  return { name: "404" };
}
const app = () => $("#app");
let lastKey = null;

function routeTitle(r) {
  const base = SITE.name;
  if (r.name === "inicio") return base;
  if (r.name === "project") return `${r.p.title} · ${base}`;
  if (r.name === "article") return `${L(r.n.title)} · ${base}`;
  if (r.name === "404") return `404 · ${base}`;
  return `${t("nav_" + r.name) !== "nav_" + r.name ? t("nav_" + r.name) : t("legal")} · ${base}`;
}
function render(opts = {}) {
  const r = parseRoute();
  document.documentElement.lang = lang;
  document.documentElement.classList.toggle("lite", lite);
  let main;
  try {
    switch (r.name) {
      case "inicio": main = pageHome(); break;
      case "proyectos": main = pageProjects(); break;
      case "project": main = pageProject(r.p); break;
      case "servicios": main = pageServices(); break;
      case "nosotros": main = pageAbout(); break;
      case "prensa": main = pagePress(); break;
      case "noticias": main = pageNews(); break;
      case "article": main = pageArticle(r.n); break;
      case "contacto": main = pageContact(); break;
      case "legal": main = pageLegal(); break;
      default: main = pageNotFound();
    }
  } catch (e) {
    /* Un dato roto nunca debe dejar la web en blanco: se muestra un aviso y se conservan cabecera y pie. */
    try { console.error("[GORRIóN] No se pudo generar la página «" + r.name + "»", e); } catch (x) { /* nada */ }
    main = pageProblem();
  }
  app().innerHTML = header(r) + `<main id="main" tabindex="-1">${main}</main>` + footer();
  brandifyDOM(app());
  document.title = routeTitle(r);
  closeOverlays();
  const key = location.hash;
  if (!opts.keepScroll && key !== lastKey) { window.scrollTo(0, 0); const h = $("#page-h"); if (h) { h.setAttribute("tabindex", "-1"); h.focus({ preventScroll: true }); } }
  lastKey = key;
  if (typeof FX !== "undefined") FX.init(app());
  if (typeof Buddy !== "undefined") Buddy.sync();
}
