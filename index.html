function closeOverlays() { ov().innerHTML = ""; lb = null; document.body.style.overflow = ""; }
function openSearch() {
  lastFocus = document.activeElement;
  ov().innerHTML = `<div class="sdlg" role="dialog" aria-modal="true" aria-label="${esc(t("search"))}"><div class="sdlg__in"><div class="sdlg__bar"><input id="sinput" type="search" placeholder="${esc(t("search_ph"))}" autocomplete="off" aria-label="${esc(t("search"))}"><button class="tbtn" data-act="close-ov" aria-label="${esc(t("close"))}">${ICONS.close}</button></div><div class="sres" id="sres" role="status"><p class="mute">${t("search_hint")}</p></div></div></div>`;
  document.body.style.overflow = "hidden";
  $("#sinput").focus();
}
function searchHTML(qraw) {
  const q = norm(qraw.trim());
  if (!q) return `<p class="mute">${t("search_hint")}</p>`;
  const out = [];
  PROJECTS.forEach((p) => { if (norm([p.title, L(p.tagline), L(p.short), typeLabel(p), p.year, p.crew.map((c) => c.n).join(" ")].join(" ")).includes(q)) out.push(`<a href="#p-${p.slug}"><span class="th" data-title="${esc(p.title)}">${posterSVG(p, lang)}</span><span><b>${esc(p.title)}</b><br><span class="mono">${esc(typeLabel(p))} · ${p.year}</span></span></a>`); });
  NEWS.forEach((n) => { if (norm([L(n.title), L(n.sum), L(n.body).join(" ")].join(" ")).includes(q)) out.push(`<a href="#n-${n.slug}"><span class="th" style="aspect-ratio:2/3;display:grid;place-items:center;font-family:var(--f-mono);font-size:.6rem;color:var(--red-hi)">NEWS</span><span><b>${esc(L(n.title))}</b><br><span class="mono">${esc(fmtDate(n.date))}</span></span></a>`); });
  return out.length ? out.join("") : `<p class="mute">${t("search_none")} “${esc(qraw)}”.</p>`;
}
function openLightbox(slug, i) {
  const p = projBy(slug); if (!p) return;
  lastFocus = document.activeElement; const N = stillCount(p); lb = { slug, i: ((i % N) + N) % N };
  ov().innerHTML = `<div class="lb" role="dialog" aria-modal="true" aria-label="${esc(p.title)}"><div class="lb__box"><div class="lb__fr">${stillMedia(p, lb.i)}</div>
    <div class="lb__bar"><span>${esc(p.title)} · ${t("still_n")} ${lb.i + 1}/${stillCount(p)}</span><span style="display:flex;gap:8px"><button class="tbtn" data-act="lb-prev" aria-label="${esc(t("prev"))}" style="transform:scaleX(-1)">${ICONS.arrow}</button><button class="tbtn" data-act="lb-next" aria-label="${esc(t("next"))}">${ICONS.arrow}</button><button class="tbtn" data-act="close-ov" aria-label="${esc(t("close"))}" id="lb-close">${ICONS.close}</button></span></div></div></div>`;
  document.body.style.overflow = "hidden"; $("#lb-close").focus();
}
function closeOv() { closeOverlays(); if (lastFocus && document.contains(lastFocus)) lastFocus.focus(); }

/* ---------- Utilidades de interfaz ---------- */
let toastT;
function toast(msg) {
  let el = $(".toast"); if (el) el.remove();
  el = document.createElement("div"); el.className = "toast"; el.setAttribute("role", "status"); el.textContent = msg; document.body.appendChild(el);
  clearTimeout(toastT); toastT = setTimeout(() => el.remove(), 2200);
}
function copyText(txt) {
  const fallback = () => {
    const ta = document.createElement("textarea"); ta.value = txt; ta.style.cssText = "position:fixed;left:-999px;top:0"; document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    ta.remove(); toast(ok ? t("copied") : t("copy_fail"));
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(() => toast(t("copied")), fallback); else fallback();
}
function refreshGrid() {
  const g = $("#pgrid"); if (g) g.innerHTML = gridHTML();
  $$('[data-act="flt"]').forEach((b) => b.setAttribute("aria-pressed", String(F[b.dataset.g] === b.dataset.v)));
}

/* ---------- Formularios ---------- */
function buildMessage(kind, d, f) {
  const lines = []; let subject = "";
  if (kind === "contact") subject = `[${d.reason}] ${d.name}`;
  if (kind === "quote") subject = `${t("quote_h")}: ${d.service || "—"}`;
  if (kind === "request") { const opt = $("#what option:checked", f); subject = `${opt ? opt.textContent : d.what} — ${d.project}`; }
  lines.push(`${t("name")}: ${d.name}`, `${t("email")}: ${d.email}`);
  if (d.org) lines.push(`${t("org").replace(/ \(.*\)/, "")}: ${d.org}`);
  if (kind === "quote") { if (d.service) lines.push(`${t("q_service")}: ${d.service}`); if (d.budget) lines.push(`${t("q_budget")}: ${d.budget}`); if (d.deadline) lines.push(`${t("q_deadline")}: ${d.deadline}`); }
  if (kind === "request") lines.push(`${t("nav_proyectos")}: ${d.project}`);
  lines.push("", d.message);
  return { subject, body: lines.join("\n") };
}
async function handleSubmit(f) {
  const kind = f.dataset.form, d = Object.fromEntries(new FormData(f)), err = $(".err", f);
  if (d.website) return;
  if (kind === "newsletter") return handleNewsletter(f, d);
  err.textContent = "";
  if (!d.name || !d.name.trim()) { err.textContent = t("e_name"); $('[name="name"]', f).focus(); return; }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.email || "")) { err.textContent = t("e_email"); $('[name="email"]', f).focus(); return; }
  if (!d.message || !d.message.trim()) { err.textContent = t("e_msg"); $('[name="message"]', f).focus(); return; }
  const m = buildMessage(kind, d, f), out = f.parentElement.querySelector(".form-out");
  if (SITE.formEndpoint) {
    try {
      const res = await fetch(SITE.formEndpoint, { method: "POST", headers: { "Content-Type": "application/json", Accept: "application/json" }, body: JSON.stringify({ subject: m.subject, ...d }) });
      if (res.ok) { out.innerHTML = `<div class="notice"><b>${t("n_sent")}</b><p>${t("n_sent_d")}</p></div>`; f.reset(); out.scrollIntoView({ block: "center" }); return; }
    } catch (e) { /* pasa al mensaje para copiar */ }
  }
  const mail = `mailto:${SITE.email}?subject=${encodeURIComponent(m.subject)}&body=${encodeURIComponent(m.body)}`;
  out.innerHTML = `<div class="notice" style="margin-top:20px"><b>${t("n_prepared")}</b><p>${t("n_prepared_d")} <span class="mono">${esc(SITE.email)}</span>.</p><pre>${esc(m.subject)}\n\n${esc(m.body)}</pre>
    <div class="notice__act"><button class="btn btn--red btn--sm" data-act="copy" data-text="${esc(m.subject + "\n\n" + m.body)}">${t("copy")}</button><a class="btn btn--sm" href="${esc(mail)}">${t("open_mail")}</a></div></div>`;
  out.scrollIntoView({ block: "center" });
}
async function handleNewsletter(f, d) {
  const msg = $("#nl-msg");
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.email || "")) { msg.textContent = t("e_email"); return; }
  if (SITE.formEndpoint) {
    try { const r = await fetch(SITE.formEndpoint, { method: "POST", headers: { "Content-Type": "application/json", Accept: "application/json" }, body: JSON.stringify({ subject: "Newsletter", email: d.email }) }); if (r.ok) { msg.textContent = t("nl_ok"); f.reset(); return; } } catch (e) { /* continúa */ }
  }
  msg.innerHTML = `${t("nl_fb")} <a href="mailto:${esc(SITE.email)}?subject=Bolet%C3%ADn" style="border-bottom:1px solid currentColor">${esc(SITE.email)}</a> ${t("nl_fb2")}`;
}

/* ---------- Eventos ---------- */
function closeLangMenu() { const m = $("#langlist"); if (m && !m.hidden) { m.hidden = true; const b = $('[data-act="langmenu"]'); if (b) b.setAttribute("aria-expanded", "false"); } }
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (!e.target.closest(".lang")) closeLangMenu();
  if (!el) { const a = e.target.closest("a[href^='#']"); if (a) { const nav = $("#nav"); if (nav) nav.classList.remove("is-open"); } return; }
  const act = el.dataset.act;
  switch (act) {
    case "skip": e.preventDefault(); { const m = $("#main"); if (m) m.focus(); } break;
    case "langmenu": { const m = $("#langlist"), o = m.hidden; m.hidden = !o; el.setAttribute("aria-expanded", String(o)); if (o) { const cur = $("[aria-current]", m); (cur || $("button", m)).focus(); } break; }
    case "setlang": lang = el.dataset.v; try { localStorage.setItem("tf-lang", lang); } catch (x) { /* ok */ } render({ keepScroll: true }); { const b = $('[data-act="langmenu"]'); if (b) b.focus(); } break;
    case "lite": lite = !lite; try { localStorage.setItem("tf-lite", lite ? "1" : "0"); } catch (x) { /* ok */ } render({ keepScroll: true }); toast(lite ? t("lite") + " ✓" : t("lite") + " ✗"); break;
    case "menu": { const nav = $("#nav"), o = nav.classList.toggle("is-open"); el.setAttribute("aria-expanded", String(o)); break; }
    case "search": openSearch(); break;
    case "close-ov": closeOv(); break;
    case "flt": F[el.dataset.g] = el.dataset.v; refreshGrid(); break;
    case "clear": F.type = F.status = F.year = "all"; F.q = ""; render({ keepScroll: true }); break;
    case "ncat": newsCat = el.dataset.v; $$('[data-act="ncat"]').forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.v === newsCat))); $("#nlist").innerHTML = newsListHTML(); break;
    case "syn": { const s = $("#syn-long"), open = s.hidden; s.hidden = !open; el.setAttribute("aria-expanded", String(open)); el.textContent = open ? t("read_less") : t("read_more"); break; }
    case "lb": openLightbox(el.dataset.slug, +el.dataset.i); break;
    case "lb-prev": if (lb) openLightbox(lb.slug, lb.i - 1); break;
    case "lb-next": if (lb) openLightbox(lb.slug, lb.i + 1); break;
    case "copy": copyText(el.dataset.text); break;
    case "to": e.preventDefault(); { const x = document.getElementById(el.dataset.to); if (x) x.scrollIntoView({ behavior: "smooth", block: "start" }); } break;
    case "scr": { const box = $("#reqform"); box.hidden = false; const s = $("#what"); if (s && el.dataset.what) s.value = el.dataset.what; box.scrollIntoView({ behavior: "smooth", block: "center" }); const n = $("#r-name"); if (n) setTimeout(() => n.focus({ preventScroll: true }), 350); break; }
    default: break;
  }
});
document.addEventListener("change", (e) => { const el = e.target; if (el.dataset && el.dataset.act === "year") { F.year = el.value; refreshGrid(); } });
document.addEventListener("input", (e) => {
  const el = e.target;
  if (el.id === "f-q") { F.q = el.value; refreshGrid(); }
  if (el.id === "sinput") $("#sres").innerHTML = searchHTML(el.value);
});
document.addEventListener("submit", (e) => { const f = e.target.closest("form[data-form]"); if (!f) return; e.preventDefault(); handleSubmit(f); });
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { closeLangMenu(); if (ov().innerHTML) closeOv(); else { const nav = $("#nav"); if (nav && nav.classList.contains("is-open")) { nav.classList.remove("is-open"); const b = $(".burger"); if (b) b.setAttribute("aria-expanded", "false"); } } }
  if (lb && e.key === "ArrowRight") openLightbox(lb.slug, lb.i + 1);
  if (lb && e.key === "ArrowLeft") openLightbox(lb.slug, lb.i - 1);
  if (e.key === "/" && !/input|textarea|select/i.test((document.activeElement || {}).tagName || "") && !ov().innerHTML) { e.preventDefault(); openSearch(); }
});
document.addEventListener("click", (e) => { const a = e.target.closest(".sres a"); if (a) closeOverlays(); });
window.addEventListener("hashchange", () => render());

/* ---------- Fotogramas: fotos subidas desde el panel (p.stills) o, si no hay, 6 fotogramas generados ---------- */
function stillImgs(p) { return (p.stills || []).map((s) => (typeof s === "string" ? s : s && s.image)).filter(Boolean); }
function stillCount(p) { return stillImgs(p).length || 6; }
function stillMedia(p, i) { const im = stillImgs(p); return im.length ? `<img src="${esc(im[i])}" alt="" loading="lazy">` : stillSVG(p.seed, i); }

/* ---------- Contenido editable ----------
   El texto vive en content/*.json (lo edita el panel /admin). data.js solo trae el contenido de ejemplo:
   si un archivo no existe o falla, la web sigue con los datos de ejemplo. */
const slugify = (s) => norm(s).replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
function fetchJSON(name) {
  return Promise.race([
    fetch("content/" + name + ".json", { cache: "no-cache" }).then((r) => (r.ok ? r.json() : null)),
    new Promise((res) => setTimeout(() => res(null), 4000))
  ]).catch(() => null);
}
function swap(arr, next) { if (Array.isArray(next)) arr.splice(0, arr.length, ...next); }
const asArr = (v) => (Array.isArray(v) ? v.filter((x) => x !== null && x !== undefined) : []);
const CONTENT_WARNINGS = [];
function warn(msg) { CONTENT_WARNINGS.push(msg); try { console.warn("[GORRIóN contenido] " + msg); } catch (e) { /* nada */ } }

/* Comprueba las relaciones entre secciones (noticias → proyecto, premios → proyecto, ids y slugs únicos).
   Nunca interrumpe la página: solo registra avisos (consola, y banner si se abre /?check). */
function auditContent() {
  CONTENT_WARNINGS.length = 0;
  const ids = new Map(), slugs = new Map();
  PROJECTS.forEach((p) => {
    if (ids.has(p.id)) warn(`Dos proyectos comparten el id «${p.id}»: «${ids.get(p.id)}» y «${p.title}».`); else ids.set(p.id, p.title);
    if (slugs.has(p.slug)) warn(`Dos proyectos comparten el enlace «${p.slug}»: «${slugs.get(p.slug)}» y «${p.title}».`); else slugs.set(p.slug, p.title);
  });
  if (PROJECTS.length && PROJECTS.filter((p) => p.featured).length > 1) warn("Hay más de un proyecto marcado como destacado; se usa el primero.");
  NEWS.forEach((n) => { if (n.project && !projBy(n.project)) warn(`La noticia «${L(n.title)}» apunta a un proyecto que ya no existe (${n.project}).`); });
  AWARDS.forEach((a) => { if (a.p && !projBy(a.p)) warn(`El premio «${L(a.a)}» (${a.f}, ${a.y}) apunta a un proyecto que ya no existe (${a.p}).`); });
  return CONTENT_WARNINGS;
}
function showWarnings() {
  if (!/[?&]check\b/.test(location.search) || !CONTENT_WARNINGS.length) return;
  const d = document.createElement("div");
  d.setAttribute("role", "alert");
  d.style.cssText = "position:fixed;left:12px;right:12px;bottom:12px;z-index:200;background:#efefef;color:#000;border:2px solid #000;box-shadow:6px 6px 0 #5f140f;padding:14px 16px;font:14px/1.5 'Courier New',monospace;max-height:40vh;overflow:auto";
  d.innerHTML = "<b>Avisos del contenido</b><ul style='margin:8px 0 0 18px'>" + CONTENT_WARNINGS.map((w) => "<li>" + esc(w) + "</li>").join("") + "</ul>";
  document.body.appendChild(d);
}

function loadContent() {
  if (typeof fetch !== "function" || location.protocol === "file:") return Promise.resolve();
  return Promise.all(["site", "proyectos", "noticias", "equipo", "servicios", "nosotros", "prensa"].map(fetchJSON)).then(([site, proy, noti, equ, serv, nos, pre]) => {
    if (site && typeof site === "object") Object.assign(SITE, site);
    SITE.social = asArr(SITE.social); SITE.channels = asArr(SITE.channels);
    if (proy && Array.isArray(proy.items)) {
      const used = new Set();
      swap(PROJECTS, asArr(proy.items).filter((x) => x && x.title).map((x) => {
        x.slug = x.slug || slugify(x.title);
        /* id permanente: si falta (contenido antiguo) se deriva una sola vez del slug actual; el panel genera uno para los nuevos */
        x.id = x.id || "proj-" + x.slug;
        if (used.has(x.id)) x.id = x.id + "-" + (used.size + 1);
        used.add(x.id);
        x.seed = Number(x.seed) || (hashStr(x.id) % 90) + 5;
        x.style = x.style || "rays"; x.type = TYPES[x.type] ? x.type : "ficcion"; x.status = STATUS[x.status] ? x.status : "desarrollo";
        ["crew", "journey", "press", "where", "stills"].forEach((k) => { x[k] = asArr(x[k]); });
        x.crew = x.crew.filter((c) => c && ROLES[c.r]);
        x.press = x.press.filter((c) => c && c.q); x.journey = x.journey.filter((c) => c && c.t); x.where = x.where.filter((c) => c && c.l);
        ["format", "genre", "tagline", "short", "long", "note"].forEach((k) => { if (!x[k] || typeof x[k] !== "object") x[k] = { es: x[k] || "", en: x[k] || "" }; });
        x.year = x.year || ""; x.runtime = x.runtime || ""; x.lang = x.lang || ""; x.subs = x.subs || ""; x.noteBy = x.noteBy || "";
        return x;
      }));
    }
    if (noti && Array.isArray(noti.items)) {
      swap(NEWS, asArr(noti.items).filter((x) => x && x.title).map((x) => {
        x.slug = x.slug || slugify(L(x.title) || "noticia");
        x.seed = Number(x.seed) || (hashStr(x.slug) % 90) + 5;
        x.cat = NEWS_CATS[x.cat] ? x.cat : "estrenos";
        x.project = x.project || null; x.date = String(x.date || "2026-01-01").slice(0, 10);
        if (!x.sum) x.sum = { es: "", en: "" };
        if (!x.body) x.body = { es: [], en: [] };
        if (x.body.es && !Array.isArray(x.body.es)) x.body.es = [String(x.body.es)];
        if (x.body.en && !Array.isArray(x.body.en)) x.body.en = [String(x.body.en)];
        x.body.es = asArr(x.body.es); x.body.en = asArr(x.body.en);
        return x;
      }).sort((a, b) => String(b.date).localeCompare(String(a.date))));
    }
    if (equ) swap(TEAM, asArr(equ.items).filter((m) => m && m.n));
    if (serv) { swap(SERVICES, asArr(serv.services).filter((s) => s && s.t).map((s) => { s.l = s.l || { es: [], en: [] }; s.l.es = asArr(s.l.es); s.l.en = asArr(s.l.en); s.icon = ICONS[s.icon] ? s.icon : "spark"; return s; })); swap(STEPS, asArr(serv.steps).filter((s) => s && s.t)); }
    if (nos) { swap(VALUES, asArr(nos.values).filter((v) => v && v.t)); swap(HISTORY, asArr(nos.history).filter((h) => h && h.t)); if (Array.isArray(nos.allies)) swap(ALLIES, nos.allies.map((a) => (typeof a === "string" ? a : a && a.name)).filter(Boolean)); if (nos.press_bio && typeof nos.press_bio === "object") Object.assign(PRESS_BIO, nos.press_bio); }
    if (pre) { swap(PRESS, asArr(pre.press).filter((x) => x && x.t)); swap(AWARDS, asArr(pre.awards).filter((a) => a && a.a)); }
  }).catch((e) => { try { console.error(e); } catch (x) { /* nada */ } });
}

/* ---------- Arranque ---------- */
document.body.insertAdjacentHTML("afterbegin", LOGO_SPRITE);
loadContent().then(() => { auditContent(); render(); showWarnings(); });
</script>
</body></html>
