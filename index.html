<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light}body{margin:0}</style>
<title>GORRIóN</title><meta name="description" content="GORRIóN · productora audiovisual independiente de La Habana, Cuba."><meta name="theme-color" content="#000000"><link rel="icon" href="favicon.ico"><meta property="og:title" content="GORRIóN"><meta property="og:description" content="Productora audiovisual independiente de La Habana, Cuba.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:ital,wght@0,500;0,800;1,500;1,800&family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
<style>
/* GORRIóN · Sistema visual
   Paleta: negro #000000 (principal), blanco #efefef (secundario), rojo #5f140f (acentos).
   Tipografía: Franklin Gothic Medium en títulos (mayúsculas con minúsculas, subrayados, negritas y cursivas, como el nombre de la marca);
   Courier New en el resto.
   Composición: hero asimétrico con un fotograma de película; secciones que alternan negro / blanco / rojo; perforaciones de película como divisor. */
:root {
  --ink: #000000;
  --bone: #efefef;
  --red: #5f140f;
  --f-display: "Franklin Gothic Medium", "Libre Franklin", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Courier New", "Courier Prime", Courier, monospace;
  --f-mono: "Courier New", "Courier Prime", Courier, monospace;
  --gutter: clamp(16px, 4vw, 48px);
  --maxw: 1240px;
  --ease: cubic-bezier(.2, .7, .2, 1);
  color-scheme: dark;
}
/* Ámbitos de color: cada sección redefine sus tonos de texto, líneas y paneles */
:root, .sc-dark {
  --bg: var(--ink); --fg: var(--bone); --acc: var(--bone);
  --mute: color-mix(in srgb, var(--bone) 68%, var(--ink));
  --line: color-mix(in srgb, var(--bone) 22%, var(--ink));
  --panel: color-mix(in srgb, var(--bone) 7%, var(--ink));
}
.sc-bone {
  --bg: var(--bone); --fg: var(--ink); --acc: var(--red);
  --mute: color-mix(in srgb, var(--ink) 68%, var(--bone));
  --line: color-mix(in srgb, var(--ink) 24%, var(--bone));
  --panel: color-mix(in srgb, var(--ink) 7%, var(--bone));
}
.sc-red {
  --bg: var(--red); --fg: var(--bone); --acc: var(--bone);
  --mute: color-mix(in srgb, var(--bone) 80%, var(--red));
  --line: color-mix(in srgb, var(--bone) 34%, var(--red));
  --panel: color-mix(in srgb, var(--ink) 30%, var(--red));
}
.sc-dark, .sc-bone, .sc-red { background: var(--bg); color: var(--fg); }

*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { background: var(--ink); color: var(--bone); font-family: var(--f-body); font-size: 16px; line-height: 1.65; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
img, svg { max-width: 100%; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; padding: 0; }
input, select, textarea { font: inherit; color: inherit; }
p { margin: 0; }
ul, ol { margin: 0; padding: 0; list-style: none; }
b, strong { font-weight: 700; }
em { font-style: italic; }
:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }
::selection { background: var(--red); color: var(--bone); }
h1[tabindex="-1"]:focus, h2[tabindex="-1"]:focus { outline: none; }

/* ---------- Títulos: Franklin Gothic Medium, mayúsculas con minúsculas de acento ---------- */
h1, h2, h3, h4 { font-family: var(--f-display); font-weight: 500; line-height: .98; letter-spacing: .01em; text-transform: uppercase; margin: 0; text-wrap: balance; }
h1 b, h2 b, h3 b, h1 strong, h2 strong { font-weight: 800; }
h1 i, h2 i, h3 i, h4 i { font-style: italic; }
h1 u, h2 u, h3 u, h4 u { text-decoration: underline; text-decoration-thickness: .075em; text-underline-offset: .13em; text-decoration-color: var(--acc); }
.lc { text-transform: lowercase; }
.hl { background: var(--red); color: var(--bone); padding: 0 .14em; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.sc-red .hl { background: var(--bone); color: var(--red); }

.eyebrow { font-weight: 700; font-size: .78rem; letter-spacing: .18em; text-transform: uppercase; color: var(--acc); display: inline-flex; align-items: center; gap: .7em; }
.eyebrow::before { content: ""; width: .62em; height: .62em; background: var(--acc); flex: none; }
.mono { font-family: var(--f-mono); }
.mute { color: var(--mute); }
.lede { font-size: clamp(1.05rem, 1.5vw, 1.2rem); max-width: 60ch; line-height: 1.6; }
.prose { max-width: 62ch; font-size: 1.02rem; }
.prose p + p { margin-top: 1em; }
.wrap { width: 100%; max-width: var(--maxw); margin-inline: auto; padding-inline: var(--gutter); }
.skip { position: absolute; left: -999px; top: 8px; z-index: 100; background: var(--bone); color: var(--ink); padding: 8px 14px; font-weight: 700; }
.skip:focus { left: 8px; }

/* Perforaciones de película */
.sprockets { height: 10px; background: linear-gradient(90deg, currentColor 10px, transparent 10px) 0 0 / 30px 10px repeat-x; opacity: .9; }

/* ---------- Botones ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .6em; min-height: 48px; padding: 0 1.3em;
  font-weight: 700; font-size: .86rem; letter-spacing: .14em; text-transform: uppercase;
  border: 2px solid var(--fg); border-radius: 0; transition: background .18s var(--ease), color .18s var(--ease), border-color .18s var(--ease);
}
.btn:hover { background: var(--fg); color: var(--bg); }
.btn--red { background: var(--red); border-color: var(--red); color: var(--bone); }
.sc-dark .btn--red { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--bone) 55%, var(--red)); border-color: var(--bone); }
.btn--red:hover { background: var(--bone); border-color: var(--bone); color: var(--ink); }
.sc-bone .btn--red:hover { background: var(--ink); border-color: var(--ink); color: var(--bone); }
.sc-red .btn { background: var(--bone); color: var(--red); border-color: var(--bone); }
.sc-red .btn:hover { background: var(--ink); border-color: var(--ink); color: var(--bone); }
.btn--sm { min-height: 38px; font-size: .76rem; padding: 0 1em; }
.btn svg { width: 1.15em; height: 1.15em; flex: none; }
.link-arrow { font-weight: 700; font-size: .8rem; letter-spacing: .14em; text-transform: uppercase; display: inline-flex; gap: .6em; align-items: center; border-bottom: 2px solid var(--acc); padding-bottom: 3px; white-space: nowrap; }
.link-arrow:hover { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.link-arrow svg { width: 1.1em; height: 1.1em; }

/* ---------- Cabecera ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; border-bottom: 1px solid var(--line); }
.top::before { content: ""; position: absolute; inset: 0; z-index: -1; background: color-mix(in srgb, var(--ink) 92%, transparent); backdrop-filter: blur(10px); }
.top__in { display: flex; align-items: center; gap: 20px; min-height: 68px; }
.brand { display: inline-flex; align-items: center; flex: none; color: var(--bone); }
.brand svg { height: 38px; width: auto; display: block; }
.nav { margin-inline: auto; display: flex; gap: clamp(14px, 2.2vw, 30px); }
.nav a { font-weight: 700; font-size: .8rem; letter-spacing: .16em; text-transform: uppercase; padding: 6px 0; border-bottom: 3px solid transparent; }
.nav a:hover { border-color: var(--line); }
.nav a[aria-current="page"] { border-color: var(--bone); }
.tools { display: flex; align-items: center; gap: 8px; }
.tbtn { min-width: 42px; height: 42px; display: inline-grid; place-items: center; padding: 0 10px; border: 1px solid var(--line); font-weight: 700; font-size: .75rem; letter-spacing: .1em; }
.tbtn:hover { border-color: var(--fg); }
.tbtn svg { width: 18px; height: 18px; }
.tbtn[aria-pressed="true"] { background: var(--bone); border-color: var(--bone); color: var(--ink); }
.burger { display: none; }
@media (max-width: 960px) {
  .nav { position: fixed; inset: calc(68px + env(safe-area-inset-top, 0px)) 0 0 0; background: var(--ink); flex-direction: column; gap: 0; padding: 12px var(--gutter) 40px; margin: 0; overflow-y: auto; transform: translateY(-8px); opacity: 0; visibility: hidden; transition: opacity .2s, transform .2s, visibility .2s; }
  .nav.is-open { opacity: 1; transform: none; visibility: visible; }
  .nav a { font-family: var(--f-display); font-weight: 500; font-size: 2.2rem; letter-spacing: .01em; padding: 14px 0; border-bottom: 1px solid var(--line); }
  .nav a[aria-current="page"] { border-color: var(--line); background: var(--red); padding-inline: 12px; }
  .burger { display: inline-grid; }
  .tools { margin-left: auto; }
}
@media (max-width: 520px) {
  .top__in { gap: 10px; }
  .brand svg { height: 32px; }
  .tools { gap: 4px; }
  .tbtn { min-width: 38px; height: 38px; padding: 0 6px; }
}

/* ---------- Secciones ---------- */
.sec { padding-block: clamp(56px, 9vw, 112px); }
.sec--tight { padding-block: clamp(36px, 6vw, 72px); }
.sec--line { border-top: 1px solid var(--line); }
.sec--alt { background: var(--panel); }
.sec__head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px 32px; margin-bottom: clamp(28px, 4vw, 48px); }
.sec__head h2 { font-size: clamp(2.4rem, 6vw, 4.6rem); }
.sec__head .eyebrow { display: inline-flex; margin-bottom: 14px; }
.h-page { font-size: clamp(3rem, 9vw, 7.2rem); }
.page-head { padding-block: clamp(48px, 8vw, 96px) clamp(28px, 4vw, 44px); border-bottom: 1px solid var(--line); position: relative; overflow: hidden; }
.page-head .lede { margin-top: 22px; }
.page-head .eyebrow { margin-bottom: 18px; }
.page-head__art { position: absolute; right: clamp(8px, 4vw, 56px); top: 28px; width: min(40vw, 340px); pointer-events: none; transform: rotate(3deg); filter: drop-shadow(0 18px 26px rgba(0, 0, 0, .5)); }
@media (max-width: 700px) { .page-head__art { opacity: .3; } }

/* ---------- Hero ---------- */
.hero { position: relative; overflow: hidden; }
.hero__grid { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, .95fr); gap: clamp(20px, 4vw, 56px); align-items: center; min-height: 600px; padding-block: clamp(36px, 6vw, 72px); }
.hero__copy { min-width: 0; position: relative; z-index: 2; }
.hero__kicker { font-weight: 700; letter-spacing: .2em; font-size: .78rem; text-transform: uppercase; color: var(--mute); margin-bottom: 22px; display: flex; align-items: center; gap: 12px; }
.hero__kicker::before { content: ""; width: 34px; height: 8px; background: linear-gradient(90deg, var(--bone) 8px, transparent 8px) 0 0 / 14px 8px repeat-x; flex: none; }
.hero h1 { font-size: clamp(2.6rem, 5.6vw, 5.4rem); line-height: .94; }
.hero__sub { margin-top: 28px; font-size: clamp(1rem, 1.4vw, 1.15rem); max-width: 46ch; }
.hero__cta { margin-top: 34px; display: flex; flex-wrap: wrap; gap: 12px; }
.hero__art { position: relative; display: flex; justify-content: flex-end; }
.hero__art svg { width: 142%; max-width: 980px; flex: none; margin-right: -24%; height: auto; transform: translate3d(0, var(--by, 0px), 0) rotate(var(--br, 0deg)) scale(var(--bsc, 1)); transform-origin: 50% 80%; filter: drop-shadow(0 26px 34px rgba(0, 0, 0, .5)); overflow: visible; will-change: transform; }
.reel-tag { position: absolute; left: 4%; bottom: 2%; font-weight: 700; font-size: .7rem; letter-spacing: .2em; text-transform: uppercase; color: var(--mute); display: flex; align-items: center; gap: 8px; }
.reel-tag i { width: 9px; height: 9px; background: var(--bone); animation: rec 1.6s infinite; }
@keyframes rec { 50% { opacity: .15; } }
@media (max-width: 860px) {
  .hero__grid { grid-template-columns: minmax(0, 1fr); min-height: 0; }
  .hero__art { order: -1; max-height: 430px; justify-content: center; } .hero__art svg { max-height: 430px; width: auto; max-width: 100%; margin-right: 0; flex: none; }
}
.dock__in { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.dock a { padding: 30px clamp(18px, 3vw, 36px); border-right: 1px solid var(--line); display: grid; grid-template-columns: 1fr auto; gap: 6px 16px; transition: background .2s; }
.dock a:last-child { border-right: 0; }
.dock a:hover { background: var(--ink); color: var(--bone); }
.dock h3 { font-size: 1.9rem; }
.dock p { grid-column: 1; font-size: .88rem; color: inherit; opacity: .8; }
.dock svg { grid-row: 1 / span 2; grid-column: 2; align-self: center; width: 28px; height: 28px; transition: transform .2s var(--ease); }
.dock a:hover svg { transform: translateX(5px); }
@media (max-width: 760px) { .dock__in { grid-template-columns: minmax(0, 1fr); } .dock a { border-right: 0; border-bottom: 1px solid var(--line); } }

/* ---------- Proyecto destacado ---------- */
.feat { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: clamp(24px, 5vw, 64px); align-items: center; }
.feat__poster { display: block; max-width: 440px; position: relative; box-shadow: 16px 16px 0 var(--red); transition: transform .35s var(--ease), box-shadow .35s var(--ease); }
.feat__poster:hover { transform: translate(-4px, -4px); box-shadow: 20px 20px 0 var(--red); }
.feat h2 { font-size: clamp(3rem, 7vw, 6rem); margin: 14px 0 18px; }
.feat .tagline { font-family: var(--f-display); font-size: clamp(1.3rem, 2.4vw, 1.9rem); color: var(--mute); line-height: 1.1; margin-bottom: 20px; font-style: italic; }
.feat__meta { margin: 26px 0 30px; display: flex; flex-wrap: wrap; gap: 8px; }
.feat__cta { display: flex; flex-wrap: wrap; gap: 12px; }
@media (max-width: 800px) { .feat { grid-template-columns: minmax(0, 1fr); } .feat__poster { max-width: 340px; } }

.chip { display: inline-flex; align-items: center; min-height: 28px; padding: 2px 10px; font-weight: 700; font-size: .68rem; letter-spacing: .14em; text-transform: uppercase; border: 1px solid var(--fg); color: var(--fg); }
.chip--ok { background: var(--fg); color: var(--bg); }
.chip--wip { background: color-mix(in srgb, var(--fg) 16%, transparent); }
.chip--dev { border-style: dashed; }

/* ---------- Tarjetas ---------- */
.grid { display: grid; gap: clamp(16px, 2.4vw, 28px); }
.grid--posters { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (min-width: 700px) { .grid--posters { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (min-width: 1040px) { .grid--posters { grid-template-columns: repeat(4, minmax(0, 1fr)); } .grid--home { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.card { position: relative; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.card__poster { position: relative; display: block; overflow: hidden; background: var(--ink); aspect-ratio: 2 / 3; }
.card__poster svg { display: block; width: 100%; height: 100%; transition: transform .6s var(--ease); }
.card:hover .card__poster svg, .card:focus-within .card__poster svg { transform: scale(1.05); }
.card__poster::after { content: ""; position: absolute; inset: 0; border: 1px solid rgba(239, 239, 239, .14); pointer-events: none; }
.card__status { --bg: var(--ink); --fg: var(--bone); position: absolute; left: 10px; top: 10px; z-index: 2; }
.card__status .chip { background: var(--ink); }
.card__status .chip--ok { background: var(--bone); }
.card h3 { font-size: 1.7rem; }
.card h3 a::after { content: ""; position: absolute; inset: 0; }
.card__meta { font-weight: 700; font-size: .7rem; letter-spacing: .14em; text-transform: uppercase; color: var(--mute); margin-bottom: 4px; }

/* ---------- Premios ---------- */
.laurels { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 0; }
.laurel { padding: 28px clamp(18px, 2.4vw, 32px); display: flex; flex-direction: column; gap: 8px; border-right: 1px solid var(--line); }
.laurel:last-child { border-right: 0; }
.laurel b { font-family: var(--f-display); font-weight: 500; font-size: 1.8rem; text-transform: uppercase; line-height: 1; }
.laurel span { font-size: .88rem; color: var(--mute); }
.laurel .mono { font-weight: 700; font-size: .7rem; letter-spacing: .16em; text-transform: uppercase; color: var(--fg); }
@media (max-width: 700px) { .laurel { border-right: 0; border-bottom: 1px solid var(--line); } }

/* ---------- Noticias ---------- */
.news { display: grid; gap: 0; border: 1px solid var(--line); }
.news--cols { grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); }
.nitem { padding: 28px; display: flex; flex-direction: column; gap: 12px; position: relative; min-width: 0; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); margin: 0 -1px -1px 0; transition: background .2s, color .2s; }
.nitem:hover { background: var(--fg); color: var(--bg); }
.nitem:hover .mono, .nitem:hover p { color: inherit; }
.nitem h3 { font-size: 1.8rem; line-height: 1; }
.nitem h3 a::after { content: ""; position: absolute; inset: 0; }
.nitem p { font-size: .94rem; color: var(--mute); }
.nitem .mono { font-weight: 700; font-size: .7rem; letter-spacing: .14em; color: var(--mute); text-transform: uppercase; }

/* ---------- Banda CTA ---------- */
.cta { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 24px 48px; }
.cta h2 { font-size: clamp(2.6rem, 7vw, 5.6rem); max-width: 13ch; }
.cta p { max-width: 40ch; margin-top: 16px; }

/* ---------- Filtros ---------- */
.filters { display: grid; gap: 18px; padding-block: 24px; border-bottom: 1px solid var(--line); }
.filters__row { display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center; }
.filters__label { font-weight: 700; font-size: .7rem; letter-spacing: .18em; text-transform: uppercase; color: var(--mute); min-width: 74px; }
.pills { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { min-height: 38px; padding: 0 14px; border: 1px solid var(--line); font-weight: 700; letter-spacing: .1em; text-transform: uppercase; font-size: .76rem; transition: background .15s, border-color .15s; }
.pill:hover { border-color: var(--fg); }
.pill[aria-pressed="true"] { background: var(--fg); border-color: var(--fg); color: var(--bg); }
.field, .select { background: var(--panel); border: 1px solid var(--line); border-radius: 0; min-height: 46px; padding: 0 14px; width: 100%; color: var(--fg); }
.select { width: auto; min-width: 120px; padding-right: 8px; }
.field:focus, .select:focus, textarea:focus { border-color: var(--fg); outline: 2px solid var(--fg); outline-offset: 2px; }
.count { font-weight: 700; font-size: .75rem; letter-spacing: .14em; text-transform: uppercase; color: var(--mute); margin: 22px 0; }
.empty { padding: 56px 20px; text-align: center; border: 2px dashed var(--line); color: var(--mute); }
.empty h3 { color: var(--fg); font-size: 2rem; margin-bottom: 8px; }

/* ---------- Ficha de proyecto ---------- */
.fh { position: relative; border-bottom: 1px solid var(--line); overflow: hidden; }
.fh__bg { position: absolute; inset: 0; opacity: .45; }
.fh__bg svg { width: 100%; height: 100%; }
.fh__bg::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, color-mix(in srgb, var(--ink) 55%, transparent), var(--ink) 96%), linear-gradient(90deg, var(--ink) 10%, transparent 70%); }
.fh__in { position: relative; display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 4fr); gap: 40px; align-items: end; padding-block: clamp(48px, 8vw, 100px) clamp(32px, 5vw, 56px); }
.fh h1 { font-size: clamp(3.2rem, 9.4vw, 7.6rem); margin: 14px 0 16px; }
.fh .tagline { font-family: var(--f-display); font-style: italic; font-size: clamp(1.4rem, 3vw, 2.2rem); line-height: 1.05; max-width: 28ch; }
.fh__poster { max-width: 300px; justify-self: end; box-shadow: 14px 14px 0 var(--red); }
.fh__cta { margin-top: 28px; display: flex; flex-wrap: wrap; gap: 12px; }
.crumb { font-weight: 700; font-size: .7rem; letter-spacing: .14em; text-transform: uppercase; color: var(--mute); display: flex; gap: 10px; flex-wrap: wrap; }
.crumb a:hover { color: var(--fg); text-decoration: underline; }
@media (max-width: 800px) { .fh__in { grid-template-columns: minmax(0, 1fr); } .fh__poster { justify-self: start; max-width: 200px; order: -1; } }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); margin: 0; border-bottom: 1px solid var(--line); }
.fact { padding: 18px 20px 18px 0; }
.fact dt { font-weight: 700; font-size: .66rem; letter-spacing: .18em; text-transform: uppercase; color: var(--mute); }
.fact dd { margin: 4px 0 0; font-family: var(--f-display); font-size: 1.5rem; text-transform: uppercase; line-height: 1.1; }
.split { display: grid; grid-template-columns: minmax(0, 4fr) minmax(0, 8fr); gap: clamp(20px, 5vw, 64px); }
.split > h2 { font-size: clamp(2rem, 4vw, 3rem); position: sticky; top: calc(88px + env(safe-area-inset-top, 0px)); align-self: start; }
@media (max-width: 800px) { .split { grid-template-columns: minmax(0, 1fr); } .split > h2 { position: static; } }
.block { padding-block: clamp(36px, 5vw, 64px); border-bottom: 1px solid var(--line); }
.block:last-of-type { border-bottom: 0; }
.more { margin-top: 18px; }
.more-btn { font-weight: 700; font-size: .76rem; letter-spacing: .14em; text-transform: uppercase; border-bottom: 2px solid var(--fg); padding-bottom: 2px; }
.credits { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); gap: 0 32px; margin: 0; }
.credits div { display: flex; flex-direction: column; padding-block: 12px; border-bottom: 1px solid var(--line); }
.credits dt { font-weight: 700; font-size: .66rem; letter-spacing: .18em; text-transform: uppercase; color: var(--mute); }
.credits dd { margin: 2px 0 0; font-size: 1rem; }
.stills { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 12px; }
.still { position: relative; display: block; width: 100%; aspect-ratio: 2.39 / 1; overflow: hidden; background: var(--ink); }
.still svg { width: 100%; height: 100%; display: block; transition: transform .5s var(--ease); }
.still:hover svg { transform: scale(1.06); }
.still span { position: absolute; left: 10px; bottom: 8px; font-weight: 700; font-size: .62rem; letter-spacing: .16em; text-transform: uppercase; color: var(--bone); text-shadow: 0 1px 6px #000; }
.quote { border-left: 6px solid var(--red); padding: 4px 0 4px 22px; font-family: var(--f-display); font-style: italic; font-size: clamp(1.6rem, 3vw, 2.4rem); line-height: 1.1; max-width: 30ch; margin: 0; }
.sc-dark .quote { border-left-color: var(--bone); }
.quote small { display: block; font-family: var(--f-body); font-style: normal; font-size: .72rem; letter-spacing: .16em; text-transform: uppercase; color: var(--mute); margin-top: 14px; font-weight: 700; }
.tline { display: grid; gap: 0; }
.tl { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 16px; padding: 16px 0; border-bottom: 1px solid var(--line); }
.tl__d { font-weight: 700; font-size: .78rem; letter-spacing: .08em; color: var(--acc); padding-top: 4px; text-transform: uppercase; }
.tl b { font-family: var(--f-display); font-weight: 500; font-size: 1.5rem; text-transform: uppercase; display: block; line-height: 1.1; }
.tl span { color: var(--mute); font-size: .9rem; }
.wherelist { display: grid; gap: 10px; }
.where { display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap; padding: 16px 18px; border: 1px solid var(--line); background: var(--panel); }
.where b { font-family: var(--f-display); font-weight: 500; text-transform: uppercase; font-size: 1.35rem; letter-spacing: .02em; }
.where span { color: var(--mute); font-size: .86rem; }

/* ---------- Servicios ---------- */
.svc { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); border: 1px solid var(--line); }
.svc__i { padding: 32px 28px 36px; display: flex; flex-direction: column; gap: 14px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); margin: 0 -1px -1px 0; transition: background .2s; }
.svc__i:hover { background: var(--panel); }
.svc__i svg { width: 44px; height: 44px; color: var(--acc); }
.svc__i h3 { font-size: 2.1rem; }
.svc__i p { color: var(--mute); }
.svc__i li { font-size: .92rem; padding-left: 20px; position: relative; }
.svc__i li::before { content: ""; position: absolute; left: 0; top: .6em; width: 8px; height: 8px; background: var(--acc); }
.steps { counter-reset: s; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); border-top: 6px solid var(--red); }
.sc-dark .steps { border-top-color: var(--bone); }
.step { counter-increment: s; padding: 24px 20px 28px; border-right: 1px solid var(--line); }
.step:first-child { padding-left: 0; }
.step::before { content: counter(s, decimal-leading-zero); font-weight: 700; font-size: .8rem; letter-spacing: .12em; color: var(--acc); display: block; margin-bottom: 14px; }
.step h3 { font-size: 1.8rem; margin-bottom: 8px; }
.step p { font-size: .9rem; color: var(--mute); }
@media (max-width: 700px) { .step { border-right: 0; border-bottom: 1px solid var(--line); padding-left: 0; } }

/* ---------- Nosotros ---------- */
.team { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap: 28px 22px; }
.person { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.person__img { aspect-ratio: 1; overflow: hidden; background: var(--ink); }
.person__img svg { width: 100%; height: 100%; display: block; }
.person h3 { font-size: 1.8rem; }
.person .role { font-weight: 700; font-size: .7rem; letter-spacing: .16em; text-transform: uppercase; color: var(--acc); }
.person p { font-size: .9rem; color: var(--mute); }
.values { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); border: 1px solid var(--line); }
.values > div { padding: 30px 24px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); margin: 0 -1px -1px 0; }
.values h3 { font-size: 1.9rem; margin-bottom: 12px; }
.values p { color: var(--mute); font-size: .92rem; }
.allies { display: flex; flex-wrap: wrap; gap: 10px; }
.ally { padding: 12px 18px; border: 1px solid var(--fg); font-weight: 700; font-size: .78rem; letter-spacing: .1em; text-transform: uppercase; }

/* ---------- Prensa ---------- */
.press { display: grid; }
.press a, .press div.pr { display: grid; grid-template-columns: 170px minmax(0, 1fr) auto; gap: 8px 20px; padding: 22px 0; border-bottom: 1px solid var(--line); align-items: baseline; }
.press a:hover b { text-decoration: underline; text-decoration-thickness: .06em; text-underline-offset: .12em; }
.press .mono { font-weight: 700; font-size: .7rem; letter-spacing: .12em; text-transform: uppercase; color: var(--mute); }
.press b { font-family: var(--f-display); font-weight: 500; font-size: 1.6rem; text-transform: uppercase; line-height: 1.05; }
.press small { color: var(--mute); display: block; font-family: var(--f-body); font-size: .88rem; text-transform: none; font-weight: 400; margin-top: 6px; }
@media (max-width: 700px) { .press a, .press div.pr { grid-template-columns: minmax(0, 1fr); } }
.kit { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 20px; }
.kit__i { border: 1px solid var(--line); padding: 24px; display: flex; flex-direction: column; gap: 14px; background: var(--panel); min-width: 0; }
.kit__i h3 { font-size: 1.7rem; }
.swatches { display: flex; gap: 10px; flex-wrap: wrap; }
.sw { width: 92px; }
.sw i { display: block; height: 64px; border: 1px solid var(--line); }
.sw span { display: block; font-weight: 700; font-size: .66rem; margin-top: 6px; color: var(--mute); letter-spacing: .06em; }
.logo-prev { display: grid; place-items: center; padding: 22px; border: 1px solid var(--line); background: var(--ink); color: var(--bone); }
.logo-prev--w { background: var(--bone); color: var(--ink); }
.logo-prev svg { max-height: 120px; width: auto; max-width: 100%; }
.bio { background: var(--bg); border: 1px solid var(--line); padding: 16px; font-size: .9rem; }

/* ---------- Formularios y contacto ---------- */
.form { display: grid; gap: 18px; }
.form__row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
@media (max-width: 640px) { .form__row { grid-template-columns: minmax(0, 1fr); } }
.form .select { width: 100%; }
.lbl { display: grid; gap: 6px; font-weight: 700; font-size: .7rem; letter-spacing: .16em; text-transform: uppercase; color: var(--mute); }
.lbl .field, .lbl .select { font-weight: 400; letter-spacing: 0; text-transform: none; font-size: 1rem; }
textarea.field { padding: 12px 14px; min-height: 150px; resize: vertical; }
.hp { position: absolute; left: -9999px; }
.notice { padding: 20px; background: var(--red); color: var(--bone); border: 2px solid var(--bone); display: grid; gap: 12px; }
.notice b { font-family: var(--f-display); font-weight: 500; font-size: 1.6rem; text-transform: uppercase; }
.notice pre { white-space: pre-wrap; word-break: break-word; margin: 0; font-family: var(--f-body); font-size: .82rem; background: var(--ink); border: 1px solid var(--line); padding: 14px; max-height: 260px; overflow: auto; }
.notice__act { display: flex; flex-wrap: wrap; gap: 10px; }
.notice .btn { border-color: var(--bone); }
.err { font-weight: 700; font-size: .86rem; min-height: 1.3em; color: var(--fg); }
.err:not(:empty)::before { content: "✕ "; }
.contact { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: clamp(28px, 6vw, 80px); }
@media (max-width: 860px) { .contact { grid-template-columns: minmax(0, 1fr); } }
.info { display: grid; align-content: start; margin: 0; }
.info > div { padding: 18px 0; border-bottom: 1px solid var(--line); }
.info dt { font-weight: 700; font-size: .68rem; letter-spacing: .18em; text-transform: uppercase; color: var(--mute); }
.info dd { margin: 4px 0 0; font-size: 1.05rem; overflow-wrap: anywhere; }
.copyline { display: inline-flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.copy { font-weight: 700; font-size: .66rem; letter-spacing: .14em; text-transform: uppercase; border: 1px solid var(--fg); padding: 3px 8px; }
.copy:hover { background: var(--fg); color: var(--bg); }

/* ---------- Noticia ---------- */
.article { max-width: 720px; margin-inline: auto; padding-block: clamp(40px, 7vw, 88px); }
.article h1 { font-size: clamp(2.8rem, 7vw, 5rem); margin: 14px 0 22px; }
.article__art { margin-block: 32px; aspect-ratio: 2.39 / 1; overflow: hidden; }
.article__art svg { width: 100%; height: 100%; display: block; }

/* ---------- Pie ---------- */
.foot { border-top: 8px solid var(--red); }
.foot__top { display: grid; grid-template-columns: minmax(0, 1.4fr) repeat(2, minmax(0, 1fr)); gap: 40px; padding-block: 56px 40px; }
@media (max-width: 800px) { .foot__top { grid-template-columns: minmax(0, 1fr); } }
.foot h4 { font-family: var(--f-body); font-weight: 700; font-size: .72rem; letter-spacing: .18em; color: var(--mute); margin-bottom: 14px; }
.foot li + li { margin-top: 8px; }
.foot li a:hover { text-decoration: underline; }
.foot .brand svg { height: 54px; }
.nl { display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
.nl .field { flex: 1 1 200px; }
.nl-msg { font-size: .85rem; margin-top: 8px; min-height: 1.3em; font-weight: 700; }
.foot__bot { border-top: 1px solid var(--line); padding-block: 20px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px 24px; font-size: .78rem; color: var(--mute); }
.foot__bot a:hover { color: var(--fg); }

/* ---------- Búsqueda, lightbox, aviso ---------- */
.sdlg { position: fixed; inset: 0; z-index: 80; background: color-mix(in srgb, var(--ink) 96%, transparent); backdrop-filter: blur(8px); padding: calc(24px + env(safe-area-inset-top, 0px)) var(--gutter) 24px; overflow-y: auto; }
.sdlg__in { max-width: 760px; margin-inline: auto; display: grid; gap: 20px; }
.sdlg__bar { display: flex; gap: 10px; align-items: center; }
.sdlg input { font-family: var(--f-display); font-weight: 500; font-size: clamp(1.6rem, 5vw, 2.4rem); text-transform: uppercase; min-height: 64px; background: transparent; border: 0; border-bottom: 4px solid var(--red); width: 100%; outline: none; letter-spacing: .02em; color: var(--bone); }
.sres a { display: grid; grid-template-columns: 70px minmax(0, 1fr); gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--line); align-items: center; }
.sres a:hover b, .sres a:focus-visible b { text-decoration: underline; }
.sres b { font-family: var(--f-display); font-weight: 500; font-size: 1.5rem; text-transform: uppercase; line-height: 1.05; }
.sres .mono { font-weight: 700; font-size: .68rem; letter-spacing: .12em; text-transform: uppercase; color: var(--mute); }
.sres .th { aspect-ratio: 2/3; overflow: hidden; background: var(--ink); }
.sres .th svg { width: 100%; height: 100%; display: block; }
.lb { position: fixed; inset: 0; z-index: 90; background: rgba(0, 0, 0, .97); display: grid; place-items: center; padding: var(--gutter); }
.lb__box { width: min(1100px, 100%); display: grid; gap: 12px; }
.lb__fr { aspect-ratio: 2.39 / 1; width: 100%; background: #000; overflow: hidden; border: 1px solid var(--line); }
.lb__fr svg { width: 100%; height: 100%; display: block; }
.lb__bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-weight: 700; font-size: .75rem; letter-spacing: .12em; text-transform: uppercase; color: var(--mute); flex-wrap: wrap; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--bone); color: var(--ink); padding: 12px 20px; font-weight: 700; font-size: .78rem; letter-spacing: .1em; text-transform: uppercase; z-index: 120; box-shadow: 6px 6px 0 var(--red); max-width: calc(100% - 32px); }

/* ---------- Movimiento ---------- */
.rise { animation: rise .7s var(--ease) both; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }
/* Modo ligero: sin animación ni efectos pesados, para conexiones lentas */
html.lite *, html.lite *::before, html.lite *::after { animation: none !important; transition: none !important; }
html.lite .top::before, html.lite .sdlg { backdrop-filter: none; background: var(--ink); }
html.lite .hero__art, html.lite .page-head__art, html.lite .fh__bg { display: none; }
html.lite .hero__grid { min-height: 0; grid-template-columns: minmax(0, 1fr); }
html.lite .fh__in { grid-template-columns: minmax(0, 1fr); }
html.lite .card__poster svg, html.lite .still svg { display: none; }
html.lite .card__poster::before { content: attr(data-title); position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 12px; font-family: var(--f-display); font-size: 1.6rem; text-transform: uppercase; }
@media (max-width: 520px) { .card h3 { font-size: 1.4rem; } .card__status { left: 6px; top: 6px; } }
@media (max-width: 860px) { .reel-tag { display: none; } }

/* ==========================================================================
   Scroll tipo guion (activo solo con html.fx; se apaga en modo ligero y con reduced-motion)
   ========================================================================== */
.sr { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; border: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
html.fx .ch { opacity: .12; transition: opacity .14s linear; }
html.fx .ch.on { opacity: 1; }
html.fx .ch.cur { position: relative; }
html.fx .ch.cur::after { content: ""; position: absolute; left: 100%; top: .1em; width: .5em; height: .92em; margin-left: .05em; background: currentColor; animation: caret 1s steps(1) infinite; }
@keyframes caret { 50% { opacity: 0; } }

/* Rótulos de escena y transiciones */
.scene { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 6px 24px; margin-bottom: clamp(22px, 3vw, 38px); font-weight: 700; font-size: .74rem; letter-spacing: .16em; text-transform: uppercase; color: var(--mute); }
.scene .cut { margin-left: auto; }
.scene--out { padding-top: 22px; margin-bottom: -26px; }
.sec--tight .scene { margin-bottom: 16px; }

/* Bloques que entran y salen según el sentido del scroll */
html.fx .rv { opacity: 0; transform: translateY(30px); transition: opacity .55s var(--ease), transform .55s var(--ease), background .2s, color .2s; }
html.fx[data-dir="up"] .rv:not(.in) { transform: translateY(-30px); }
html.fx .rv.in { opacity: 1; transform: none; transition-delay: calc(var(--i, 0) * 70ms), calc(var(--i, 0) * 70ms), 0s, 0s; }
html.fx .rv .card__poster { clip-path: inset(0 0 100% 0); transition: clip-path .8s var(--ease); }
html.fx[data-dir="up"] .rv:not(.in) .card__poster { clip-path: inset(100% 0 0 0); }
html.fx .rv.in .card__poster { clip-path: inset(0 0 0 0); transition-delay: calc(var(--i, 0) * 70ms + 120ms); }

/* Contador de página y progreso */
.pager { position: fixed; right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 40; display: flex; align-items: center; gap: 10px; padding: 6px 10px; background: #000; color: var(--bone); border: 1px solid var(--bone); font-weight: 700; font-size: .66rem; letter-spacing: .16em; text-transform: uppercase; pointer-events: none; }
.pager i { display: block; width: 44px; height: 2px; background: color-mix(in srgb, var(--bone) 30%, #000); position: relative; }
.pager b { position: absolute; inset: 0 auto 0 0; width: calc(var(--prog, 0) * 100%); background: var(--bone); }
.pager[hidden] { display: none; }
.top::after { content: ""; position: absolute; left: 0; bottom: -1px; height: 3px; width: calc(var(--prog, 0) * 100%); background: var(--bone); }
@media (max-width: 520px) { .pager i { width: 28px; } }
@media (prefers-reduced-motion: reduce) { .pager { display: none; } }
html.lite .pager, html.lite .top::after { display: none; }

/* ---------- Selector de idioma ---------- */
.lang { position: relative; }
.lang .tbtn { gap: 6px; display: inline-flex; align-items: center; justify-content: center; }
.lang__list { position: absolute; right: 0; top: calc(100% + 8px); z-index: 70; min-width: 180px; background: #000; border: 1px solid var(--bone); box-shadow: 6px 6px 0 var(--red); }
.lang__list[hidden] { display: none; }
.lang__list li + li { border-top: 1px solid var(--line); }
.lang__list button { width: 100%; text-align: left; padding: 12px 16px; font-weight: 700; font-size: .84rem; letter-spacing: .12em; text-transform: uppercase; display: flex; justify-content: space-between; gap: 12px; }
.lang__list button:hover, .lang__list button:focus-visible { background: var(--bone); color: #000; outline-offset: -3px; }
.lang__list button[aria-current="true"]::after { content: "●"; font-size: .7em; align-self: center; }

/* ---------- Idiomas con palabras largas (alemán, francés…): nunca desbordar ---------- */
h1, h2, h3, h4, .lede, .prose, .nitem p, .where b, .tl b, .press b, .fact dd, .credits dd, .card h3, .person h3, .quote, .cta p, .info dd { overflow-wrap: anywhere; hyphens: auto; }
.btn { text-align: center; }
.split > *, .contact > *, .feat > *, .fh__in > *, .hero__grid > *, .foot__top > * { min-width: 0; }
@media (max-width: 520px) {
  .h-page, .fh h1, .hero h1, .article h1 { font-size: clamp(2rem, 10vw, 2.9rem); }
  .sec__head h2, .cta h2, .feat h2 { font-size: clamp(1.9rem, 9vw, 2.6rem); }
  .svc__i h3, .values h3, .step h3, .nitem h3 { font-size: 1.5rem; }
  .tl { grid-template-columns: 78px minmax(0, 1fr); }
}
html:lang(de) .hero h1, html:lang(it) .hero h1 { font-size: clamp(2.4rem, 5vw, 4.6rem); }
html:lang(fr) .hero h1, html:lang(pt) .hero h1 { font-size: clamp(2.6rem, 6vw, 5.6rem); }
@media (max-width: 520px) { html:lang(de) .hero h1, html:lang(it) .hero h1, html:lang(fr) .hero h1, html:lang(pt) .hero h1 { font-size: clamp(2rem, 10vw, 2.9rem); } }

html { background-color: var(--ink); background-image: var(--p1); }
.sc-dark, .sc-bone, .sc-red { background-image: var(--p1); position: relative; }
main > section:nth-of-type(4n+2) { background-image: var(--p2); }
main > section:nth-of-type(4n+3) { background-image: var(--p3); background-size: 500px 500px; }
main > section:nth-of-type(4n+4) { background-image: var(--p4); }
.top, .foot { background-image: var(--p2); }
.page-head { background-image: var(--p3); background-size: 500px 500px; }
main > section + section { box-shadow: inset 0 10px 14px -12px rgba(0, 0, 0, .4); }
.sc-bone.sec, .sc-bone.dock { box-shadow: inset 0 10px 14px -12px rgba(0, 0, 0, .22), inset 0 -1px 0 rgba(0, 0, 0, .08); }
html.lite .sc-dark, html.lite .sc-bone, html.lite .sc-red, html.lite main > section, html.lite .top, html.lite .foot, html.lite .page-head { background-image: none !important; box-shadow: none !important; }
html.lite { background-image: none; }

/* ===== Hero: gorrión animado (loop) ===== */
.bd-lid { transform-box: fill-box; }
.bd-body { animation: bd-peck 5.6s ease-in-out infinite; transform-box: view-box; transform-origin: 600px 790px; }
.bd-lid { animation: bd-blink 5.6s infinite; transform-origin: 50% 0%; }
.bd-fence { animation: bd-slide 9s linear infinite; }
@keyframes bd-peck { 0%, 100% { transform: translateY(0) rotate(0); } 12% { transform: translateY(-7px) rotate(-.8deg); } 24% { transform: translateY(0) rotate(0); } 30% { transform: translateY(8px) rotate(3.4deg); } 36% { transform: translateY(0) rotate(0); } 42% { transform: translateY(8px) rotate(3.4deg); } 50% { transform: translateY(0) rotate(0); } 66% { transform: translateY(-5px) rotate(-1.6deg); } 82% { transform: translateY(-2px) rotate(1deg); } }
@keyframes bd-blink { 0%, 56%, 60%, 100% { transform: scaleY(0); } 58% { transform: scaleY(1); } 88% { transform: scaleY(0); } 90% { transform: scaleY(1); } 92% { transform: scaleY(0); } }
@keyframes bd-slide { to { transform: translateX(-92px); } }

/* ===== Gorrión compañero (esquina inferior derecha) ===== */
.buddy { position: fixed; right: max(10px, env(safe-area-inset-right, 0px)); bottom: max(10px, env(safe-area-inset-bottom, 0px)); z-index: 70; display: flex; align-items: flex-end; gap: 2px; visibility: hidden; opacity: 0; pointer-events: none; transition: opacity .3s, visibility 0s .3s; }
.buddy.on { visibility: visible; opacity: 1; pointer-events: auto; transition: opacity .2s; }
.buddy__bird { width: clamp(96px, 9.5vw, 142px); flex: none; }
.buddy__svg { width: 100%; height: auto; display: block; filter: drop-shadow(0 8px 10px rgba(0, 0, 0, .5)); }
.buddy.on .buddy__bird { animation: buddy-fly 1.05s cubic-bezier(.3, .7, .3, 1) both; }
.buddy__bird { background: none; border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.buddy.static.on .buddy__bird:not(.hop) { animation: none; }
.buddy.static .fb-wing { animation: none !important; opacity: 0 !important; }
.buddy__bird.hop { animation: buddy-hop .5s ease-out; }
.buddy__bird:focus-visible { outline: 2px solid var(--bone); outline-offset: 4px; }
.fb-wing { opacity: 0; transform-box: view-box; transform-origin: 700px 372px; }
.buddy.on .fb-wing { animation: wing-flap .13s ease-in-out infinite alternate, wing-show 1.05s linear both; }
.buddy.on .fb-wing--back { animation-delay: -.05s, 0s; }
.buddy__bubble { position: relative; margin-bottom: 38px; max-width: min(250px, 62vw); padding: 14px 16px 16px; background: var(--bone); color: #000; border: 2px solid #000; box-shadow: 6px 6px 0 var(--red); transform: scale(.4); opacity: 0; transform-origin: 100% 100%; }
.buddy.talk .buddy__bubble { opacity: 1; transform: none; pointer-events: auto; transition: transform .35s cubic-bezier(.3, 1.5, .5, 1), opacity .25s; }
.buddy__bubble { pointer-events: none; transition: transform .45s ease-in, opacity .6s ease-in; }
.buddy__bubble::after { content: ""; position: absolute; right: -13px; bottom: 16px; border: 8px solid transparent; border-left: 13px solid #000; }
.buddy__bubble::before { content: ""; position: absolute; right: -9px; bottom: 18px; z-index: 1; border: 6px solid transparent; border-left: 10px solid var(--bone); }
.buddy__bubble p { font-family: var(--f-body); font-weight: 700; font-size: .92rem; line-height: 1.35; margin: 0 14px 10px 0; color: #000; }
.buddy__bubble .btn { width: 100%; justify-content: center; padding: 10px 14px; font-size: .74rem; }
.buddy__x { position: absolute; top: 2px; right: 6px; background: none; border: 0; font-size: 1.3rem; line-height: 1; color: #000; cursor: pointer; padding: 4px; }
.fb-body { animation: fb-bob 2.4s ease-in-out infinite; transform-origin: 540px 790px; }
html.buddy-on .pager { opacity: 0; }
html.lite .buddy__bird { display: none; }
html.lite .buddy.on .buddy__bubble { opacity: 1; transform: none; pointer-events: auto; }
html.lite .buddy__bubble::before, html.lite .buddy__bubble::after { display: none; }
@keyframes buddy-fly {
  0% { transform: translate(-70vw, -78vh) scale(4.2) rotate(-16deg); opacity: 0; }
  12% { opacity: 1; }
  40% { transform: translate(-40vw, -26vh) scale(2.6) rotate(10deg); }
  70% { transform: translate(-9vw, 5vh) scale(1.3) rotate(-8deg); }
  86% { transform: translate(0, -9px) scale(1) rotate(3deg); }
  100% { transform: none; opacity: 1; }
}
@keyframes wing-flap { from { transform: rotate(24deg); } to { transform: rotate(-58deg); } }
@keyframes wing-show { 0% { opacity: 0; } 6% { opacity: 1; } 84% { opacity: 1; } 94%, 100% { opacity: 0; } }
@keyframes buddy-hop { 0% { transform: none; } 35% { transform: translateY(-14px) rotate(-6deg); } 100% { transform: none; } }
@keyframes buddy-pop { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@keyframes fb-bob { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-4px) rotate(-1.4deg); } }
@media (max-width: 520px) { .buddy__bird { width: 78px; } .buddy__bubble { margin-bottom: 26px; padding: 12px 12px 14px; } }
@media (prefers-reduced-motion: reduce) { .buddy.on .buddy__bird { opacity: 1; } }

illage et son ancienne sucrerie, entre la mémoire de la récolte et ce que l'on fait aujourd'hui de ses ruines.","Los obreros que quedan recorren las naves del central como quien visita a un familiar. Los hijos usan el batey para jugar béisbol, y los camiones que pasan por la carretera ya no se detienen. Con archivo familiar y sonido directo, el documental escucha cómo cambia la relación de un pueblo con el lugar que le dio nombre.":"Les ouvriers qui restent parcourent les halls de la sucrerie comme on rend visite à un parent. Les enfants se servent du batey pour jouer au base-ball, et les camions qui passent sur la route ne s'arrêtent plus. Avec des archives familiales et du son direct, le documentaire écoute comment change le rapport d'un village au lieu qui lui a donné son nom.","Estreno":"Première","Mención especial del jurado":"Mention spéciale du jury","El sonido hace lo que las imágenes no se atreven.":"Le son fait ce que les images n'osent pas.","Ver completo":"Voir en entier","Vimeo · acceso libre":"Vimeo · accès libre","Musical":"Musical","Una banda, una azotea y tres cámaras.":"Un groupe, un toit et trois caméras.","Plano secuencia sobre los techos para el tema de Los Hijos del Aguacero.":"Un plan-séquence sur les toits pour le morceau de Los Hijos del Aguacero.","Tres cámaras y un solo plano secuencia sobre una azotea de El Cerro, con la banda tocando en directo mientras el vecindario aparece en cada balcón. Grabado en una tarde, con luz de atardecer y un ensayo previo de cuatro días.":"Trois caméras et un seul plan-séquence sur un toit d'El Cerro, avec le groupe jouant en direct tandis que le voisinage apparaît à chaque balcon. Enregistré en un après-midi, à la lumière du couchant, après quatre jours de répétition.","Estreno en línea":"Première en ligne","Ver el videoclip":"Voir le clip vidéo","YouTube":"YouTube","Película institucional":"Film institutionnel","Institucional":"Institutionnel","El café también tiene a quién agradecerle.":"Le café a aussi q é de maisons et de la famille, filmées avec patience et sans carte postale.","Equipos pequeños":"Petites équipes","Pocas personas, mucho oficio. Así llegamos a lugares donde un gran equipo no cabe.":"Peu de personnes, beaucoup de métier. C'est ainsi que nous arrivons là où une grosse équipe ne tiendrait pas.","Hecho con la gente":"Fait avec les gens","Vecinos en el reparto, locaciones prestadas, premios compartidos.":"Des voisins dans la distribution, des lieux prêtés, des prix partagés.","Cine independiente":"Cinéma indépendant","Elegimos qué contar y con quién. Financiamos con fondos, coproducciones y encargos.":"Nous choisissons ce que nous racontons et avec qui. Nous finançons par des fonds, des coproductions et des commandes.","Nace GORRIóN":"Naissance de GORRIóN","Cuatro amigos, una cámara prestada y una azotea del Vedado.":"Quatre amis, une caméra empruntée et un toit du Vedado.","Primeros encargos":"Premières commandes","Videoclips y películas institucionales que financian los proyectos propios.":"Clips vidéo et films institutionnels qui financent nos projets personnels.","Sal y Cañaveral":"Sal y Cañaveral","Primer documental con selección internacional.":"Premier documentaire en sélection internationale.","Malecón, 6 a.m.":"Malecón, 6 a.m.","Nuestro primer largometraje.":"Notre premier long métrage.","Pan de Bodega":"Pan de Bodega","Empieza el rodaje de nuestra primera serie.":"Début du tournage de notre première série.","GORRIóN es una productora audiovisual independiente con sede en La Habana. Desde 2018 produce ficción, documental, series y videoclips con equipos pequeños y una mirada cercana a la vida cotidiana. Sus películas se han presentado en festivales de América Latina.":"GORRIóN est une société de production audiovisuelle indépendante basée à La Havane. Depuis 2018, elle produit fictions, documentaires, séries et clips vidéo avec de petites équipes et un regard proche de la vie quotidienne. Ses films ont été présentés dans des festivals d'Amérique latine.","Saltar al contenido":"Aller au contenu","Proyectos":"Projets","Servicios":"Services","Nosotros":"Qui sommes-nous","Prensa":"Presse","Noticias":"Actualités","Contacto":"Contact","Menú":"Menu","Cerrar":"Fermer","Buscar":"Rechercher","Modo ligero":"Mode léger","Menos animaciones y gráficos, para conexiones lentas":"Moins d'animations et de graphismes, pour les connexions lentes","Idioma":"Langue","Negro":"Noir","Blanco":"Blanc","Rojo":"Rouge","Cine <i class=\"lc\">independiente</i> hecho en <span class=\"hl\">Cuba</span>.":"Cinéma <i class=\"lc\">indépendant</i> fait à <span class=\"hl\">Cuba</span>.","Título, nombre, tema…":"Titre, nom, thème…","Busca entre proyectos y noticias.":"Cherchez parmi les projets et les actualités.","No hay resultados para":"Aucun résultat pour","Productora audiovisual independiente · La Habana":"Société de production audiovisuelle indépendante · La Havane","Hacemos ficción, documental, series y videoclips con equipos pequeños y mucha calle. Producimos nuestros proyectos y los de quienes quieren filmar en Cuba.":"Nous faisons de la fiction, du documentaire, des séries et des clips vidéo avec de petites équipes et beaucoup de terrain. Nous produisons nos projets et ceux de celles et ceux qui veulent filmer à Cuba.","Ver proyectos":"Voir les projets","Ver el reel":"Voir le reel","Ficción, documental, series y más":"Fiction, documentaire, séries et plus","Producción, rodaje y posproducción":"Production, tournage et postproduction","Cuéntanos tu proyecto":"Parlez-nous de votre projet","Estreno destacado":"Sortie à l'affiche","Ver ficha":"Voir la fiche","Ver tráiler":"Voir la bande-annonce","Selección de <u>proyectos</u>":"Sélection de <u>projets</u>","Ver todos":"Tout voir","Premios y selecciones":"Prix et sélections","Quiénes somos":"Qui nous sommes","Equipos <b>pequeños</b>, historias <u>grandes</u>.":"Petites <b>équipes</b>, grandes <u>histoires</u>.","GORRIóN nació en 2018 en una azotea del Vedado. Producimos cine que mira de cerca la vida cotidiana: la cola de la bodega, el muro del Malecón, el vecino que sube a ver el cielo. Trabajamos con fondos, coproducciones y encargos, y decidimos nosotros qué contar.":"GORRIóN est née en 2018 sur un toit du Vedado. Nous produisons un cinéma qui regarde de près la vie quotidienne : la file de l'épicerie, le mur du Malecón, le voisin qui monte regarder le ciel. Nous travaillons avec des fonds, des coproductions et des commandes, et c'est nous qui décidons de ce que nous racontons.","Conocer al equipo":"Rencontrer l'équipe","Últimas <u>noticias</u>":"Dernières <u>actualités</u>","Todas las noticias":"Toutes les actualités","¿Tienes un <u>proyecto</u>? Hablemos.":"Un <u>projet</u> en tête ? Parlons-en.","Cuéntanos la idea y te respondemos en uno o dos días.":"Parlez-nous de votre idée, nous vous répondons sous un à deux jours.","Escribir a la productora":"Écrire à la production","Catálogo":"Catalogue","Películas, documentales, series, videoclips y encargos. Filtra por tipo, estado o año.":"Films, documentaires, séries, clips vidéo et commandes. Filtrez par type, statut ou année.","Tipo":"Type","Estado":"Statut","Año":"Année","Todos":"Tous","Título o nombre…":"Titre ou nom…","proyecto":"projet","proyectos":"projets","Sin resultados":"Aucun résultat","Prueba con otro filtro o borra la búsqueda.":"Essayez un autre filtre ou effacez la recherche.","Borrar filtros":"Effacer les filtres","Inicio":"Accueil","Formato":"Format","Duración":"Durée","Género":"Genre","Subtítulos":"Sous-titres","Sinopsis":"Synopsis","Leer sinopsis completa":"Lire le synopsis complet","Ocultar":"Masquer","Ficha técnica y artística":"Fiche technique et artistique","Galería":"Galerie","Fotograma":"Photogramme","Nota de dirección":"Note d'intention","Recorrido":"Parcours","Dónde verla":"Où le voir","Abrir":"Ouvrir","Solicitar":"Demander","Ir":"Aller","Materiales":"Matériel","Los materiales se envían bajo petición, con la resolución que necesites.":"Les documents sont envoyés sur demande nicos que se conocieron filmando en azoteas, portales y bodegas. Producimos ficción, documental, series y videoclips, y también damos servicio a otros proyectos.":"Nous sommes cinéastes, productrices et techniciens, et nous nous sommes rencontrés en filmant sur des toits, des perrons et dans des épiceries. Nous produisons fiction, documentaire, séries et clips vidéo, et nous offrons aussi nos services à d'autres projets.","Creemos que el cine independiente es una forma de elegir qué historias se cuentan y con quién. Por eso trabajamos con equipos pequeños, con vecinos en el reparto y con un presupuesto que cabe en un buen plano.":"Nous croyons que le cinéma indépendant est une façon de choisir quelles histoires on raconte et avec qui. C'est pourquoi nous travaillons avec de petites équipes, avec des voisins dans la distribution et avec un budget qui tient dans un beau plan.","Prensa y festivales":"Presse et festivals","Premios, selecciones, menciones en medios y materiales para periodistas y programadores.":"Prix, sélections, mentions dans les médias et documents pour les journalistes et les programmateurs.","En la prensa":"Dans la presse","Biografía":"Biographie","Copiar":"Copier","Copiado":"Copié","Selecciona el texto y cópialo":"Sélectionnez le texte et copiez-le","Logotipo":"Logo","Paleta":"Palette","Solicitar logos, fotos y dosier":"Demander logos, photos et dossier","Contacto de prensa":"Contact presse","Entrevistas, acreditaciones y solicitudes de material.":"Entretiens, accréditations et demandes de documents.","Noticias y diario de rodaje":"Actualités et journal de tournage","Estrenos, rodajes, convocatorias y lo que pasa detrás de cámaras.":"Sorties, tournages, appels à candidatures et ce qui se passe dans les coulisses.","Volver a noticias":"Retour aux actualités","Proyecto relacionado":"Projet lié","<b>Hablemos</b>":"<b>Parlons-en</b>","Colaboraciones, encargos, prensa o distribución. Elige el motivo y cuéntanos.":"Collaborations, commandes, presse ou di Suivez-nous","Aviso legal y privacidad":"Mentions légales et confidentialité","Todos los derechos reservados.":"Tous droits réservés.","Nombres, premios y textos de ejemplo: sustitúyelos en data.js.":"Noms, prix et textes d'exemple : remplacez-les dans data.js.","Titular":"Éditeur","GORRIóN, productora audiovisual independiente con sede en La Habana, Cuba. Contacto: ":"GORRIóN, société de production audiovisuelle indépendante basée à La Havane, Cuba. Contact : ","Propiedad intelectual":"Propriété intellectuelle","Las películas, textos, imágenes y marcas de este sitio pertenecen a GORRIóN o a sus autores. No pueden reproducirse sin permiso por escrito.":"Les films, textes, images et marques de ce site appartiennent à GORRIóN ou à leurs auteurs. Ils ne peuvent être reproduits sans autorisation écrite.","Datos personales":"Données personnelles","Los datos que escribas en los formularios se usan solo para responder a tu mensaje. No los cedemos a terceros ni los usamos para otros fines. Puedes pedir que los borremos escribiendo al correo de contacto.":"Les données que vous saisissez dans les formulaires servent uniquement à répondre à votre message. Nous ne les cédons pas à des tiers et ne les utilisons pas à d'autres fins. Vous pouvez demander leur suppression en écrivant à l'adresse e-mail de contact.","Almacenamiento en tu navegador":"Stockage dans votre navigateur","El sitio guarda en tu navegador únicamente tus preferencias de idioma y de modo ligero. No usa cookies de seguimiento.":"Le site enregistre dans votre navigateur uniquement vos préférences de langue et de mode léger. Il n'utilise aucun cookie de suivi.","Esta página no existe":"Cette page n'existe pas","Puede que el enlace esté roto o que el contenido se haya movido.":"Le lien est peut-être rompu ou le contenu a peut-être été déplacé.","Ir al inicio":"Aller à l'accueil","Anterior":"Précédent","Siguiente":"Suivant","Reel 2026":"Reel 2026"},"pt":{"La Habana, Cuba":"Havana, Cuba","Ficción":"Ficção","Documental":"Documentário","Serie web":"Série web","Videoclip":"Videoclipe","Encargo y publicidad":"Encomendas e publicidade","Estrenado":"Estreado","En producción":"Em produção","En desarrollo":"Em desenvolvimento","Dirección":"Direção","Guion":"Argumento","Producción":"Produção","Producción ejecutiva":"Produção executiva","Fotografía":"Fotografia","Montaje":"Montagem","Sonido":"Som","Música":"Música","Dirección de arte":"Direção de arte","Reparto":"Elenco","Cliente":"Cliente","Cortometraje":"Curta-metragem","Drama íntimo":"Drama intimista","Hay noches que duran lo que un aleteo.":"Há noites que duram o tempo de um bater de asas.","Una niña de once años sube cada madrugada a la azotea para seguir a un zunzún que, cree ella, trae noticias de su madre.":"Uma menina de onze anos sobe todas as madrugadas ao terraço para seguir um zunzún que, acredita ela, traz notícias da mãe.","Lena vive con su abuelo en un edificio de Centro Habana. Desde que su madre emigró, la azotea se ha convertido en su observatorio: allí espera, antes de que salga el sol, a un zunzún que visita siempre el mismo tendedero. Cuando el ave deja de aparecer, Lena decide seguirla por los techos del barrio y descubre una ciudad que nadie le había enseñado a mirar. Rodada en 16 mm de luz natural y con vecinos del barrio como parte del reparto, la película cuenta una ausencia sin pronunciar nunca la palabra.":"Lena vive com o avô num prédio de Centro Habana. Desde que a mãe emigrou, o terraço transformou-se no seu observatório: ali espera, antes de o sol nascer, por um zunzún que visita sempre o mesmo estendal. Quando a ave deixa de aparecer, Lena decide segui-la pelos telhados do bairro e descobre uma cidade que ninguém lhe ensinara a olhar. Filmada em 16 mm com luz natural e com moradores do bairro no elenco, a película conta uma ausência sem nunca pronunciar a palavra.","Quería hacer una película sobre alguien que espera sin que la espera sea un lamento. Los techos de La Habana son el único lugar donde una niña puede estar sola y a la vez rodeada de toda la ciudad.":"Queria fazer um filme sobre alguém que espera sem que a espera seja um lamento. Os telhados de Havana são o único lugar onde uma menina pode estar sozinha e, ao mesmo tempo, rodeada por toda a cidade.","Estreno mundial":"Estreia mundial","Premio del Público · Cortometraje":"Prémio do Público · Curta-metragem","Selección oficial":"Seleção oficial","Un corto que mira hacia arriba y lo ve todo.":"Uma curta que olha para cima e vê tudo.","Delicadeza rara en el cine de hoy.":"Uma delicadeza rara no cinema de hoje.","Tráiler":"Trailer","Vimeo · 1 min 40 s":"Vimeo · 1 min 40 s","Ver la película":"Ver o filme","Disponible bajo petición (screener)":"Disponível a pedido (screener)","Largometraje":"Longa-metragem","Documental de observación":"Documentário de observação","La ciudad despierta de cara al mar.":"A cidade desperta virada para o mar.","Pescadores, barrenderos, corredores y enamorados al borde del muro durante los noventa minutos en que el Malecón cambia de turno.":"Pescadores, varredores, corredores e namorados à beira do muro durante os noventa minutos em que o Malecón muda de turno.","Durante once meses, un equipo de cuatro personas filmó cada amanecer en el mismo tramo del Malecón habanero. Sin entrevistas ni voz en off, la película se arma con lo que el muro ve cuando casi nadie lo mira: el pescador que lleva treinta años en el mismo escalón, la brigada que lava la acera antes del primer sol, la pareja que se despide sin saber si será por mucho tiempo. Un retrato coral de la ciudad a esa hora en que todavía no ha decidido quién va a ser hoy.":"Durante onze meses, uma equipa de quatro pessoas filmou cada amanhecer no mesmo troço do Malecón de Havana. Sem entrevistas nem voz off, o filme constrói-se com o que o muro vê quando quase ninguém olha: o pescador que há trinta anos ocupa o mesmo degrau, a brigada que lava o passeio antes do primeiro sol, o casal que se despede sem saber se será por muito tempo. Um retrato coral da cidade àquela hora em que ainda não decidiu quem vai ser hoje.","No buscábamos explicar el Malecón. Queríamos quedarnos el tiempo suficiente para que dejara de ser un lugar y se volviera una costumbre.":"Não queríamos explicar o Malecón. Queríamos ficar o tempo suficiente para que deixasse de ser um lugar e se tornasse um hábito.","Estreno internacional":"Estreia internacional","Mejor Fotografía Documental":"Melhor Fotografia Documental","Proyección especial":"Sessão especial","Observa sin invadir y por eso lo dice todo.":"Observa sem invadir, e por isso diz tudo.","Vimeo · 2 min":"Vimeo · 2 min","Solicitar proyección":"Solicitar sessão","Cineclubes, universidades y festivales":"Cineclubes, universidades e festivais","Serie web · 8 × 12 min":"Série web · 8 × 12 min","Comedia costumbrista":"Comédia de costumes","En la cola se cuenta todo, menos lo que de verdad importa.":"Na fila conta-se tudo, menos o que realmente importa.","Ocho episodios en una misma cuadra, una misma bodega y una cola que lo sabe todo de todos.":"Oito episódios no mesmo quarteirão, na mesma mercearia e numa fila que sabe tudo sobre todos.","Cada episodio ocurre durante la espera del pan de la mañana. En doce minutos y en tiempo casi real, los vecinos de una cuadra de Santos Suárez se enteran de bodas, se pelean por turnos, negocian favores y descubren que el dependiente guarda un secreto. La serie combina actores profesionales con vecinos y está pensada para verse en el móvil, incluso con conexión limitada.":"Cada episódio decorre durante a espera pelo pão da manhã. Em doze minutos e em tempo quase real, os vizinhos de um quarteirão de Santos Suárez ficam a saber de casamentos, discutem por causa das vezes, negociam favores e descobrem que o empregado guarda um segredo. A série combina atores profissionais com moradores e foi pensada para ser vista no telemóvel, mesmo com ligação limitada.","Fin de la escritura":"Fim da escrita","Inicio del rodaje":"Início das filmagens","Seguir el rodaje":"Acompanhar as filmagens","Diario de rodaje en Noticias":"Diário de rodagem em Notícias","Comedia coral":"Comédia coral","Cuando se apaga la luz, se encienden los vecinos.":"Quando a luz se apaga, os vizinhos acendem-se.","Una noche, un edificio y once familias obligadas a salir al portal a conversar.":"Uma noite, um prédio e onze famílias obrigadas a sair para a entrada a conversar.","Un edificio de cuatro plantas se queda a oscuras la noche de una boda, un cumpleaños y una discusión pendiente. A la luz de las velas, los vecinos sacan al portal sillas, rencores y la mitad de una receta. Una comedia coral sobre cómo se habita junto a los demás. El proyecto se encuentra en desarrollo y busca coproductores.":"Um prédio de quatro andares fica às escuras na noite de um casamento, de um aniversário e de uma discussão por resolver. À luz das velas, os vizinhos levam para a entrada cadeiras, rancores e metade de uma receita. Uma comédia coral sobre como se vive ao lado dos outros. O projeto está em desenvolvimento e procura coprodutores.","Seleccionado para pitch":"Selecionado para pitch","Coproducción":"Coprodução","Dosier y tratamiento disponibles":"Dossiê e tratamento disponíveis","Mediometraje":"Média-metragem","Documental poético":"Documentário poético","Un pueblo que aprendió a oír el silencio de su fábrica.":"Uma aldeia que aprendeu a ouvir o silêncio da sua fábrica.","Un pueblo y su antiguo central azucarero, entre la memoria de la zafra y lo que se hace hoy con sus ruinas.":"Uma aldeia e a sua antiga fábrica de açúcar, entre a memória da safra e o que hoje se faz com as suas ruínas.","Los obreros que quedan recorren las naves del central como quien visita a un familiar. Los hijos usan el batey para jugar béisbol, y los camiones que pasan por la carretera ya no se detienen. Con archivo familiar y sonido directo, el documental escucha cómo cambia la relación de un pueblo con el lugar que le dio nombre.":"Os operários que ficam percorrem os pavilhões ón y arte para proyectos de 2026 y 2027.":"Assistentes de câmara, técnicos de som, produção e arte para projetos de 2026 e 2027.","Abrimos una convocatoria para sumar personas a los equipos de producción, cámara, sonido y arte. No se exige experiencia previa en cine, pero sí ganas de aprender en rodajes reales.":"Abrimos uma chamada para juntar pessoas às equipas de produção, câmara, som e arte. Não é exigida experiência prévia em cinema, mas sim vontade de aprender em filmagens reais.","Escríbenos a través del formulario de contacto eligiendo el motivo «Colaboración», cuéntanos qué sabes hacer y adjunta un enlace a algún trabajo si lo tienes.":"Escreva-nos através do formulário de contacto, escolhendo o motivo «Colaboração», conte-nos o que sabe fazer e anexe um link para algum trabalho, se tiver.","Detrás de cámaras: once meses frente al mismo muro":"Nos bastidores: onze meses diante do mesmo muro","Cómo se rodó Malecón, 6 a.m. con un equipo de cuatro personas y una sola cámara.":"Como se filmou Malecón, 6 a.m. com uma equipa de quatro pessoas e uma única câmara.","Rodar cada día en el mismo sitio exige disciplina y paciencia: a veces el amanecer no regala nada y hay que volver al día siguiente.":"Filmar todos os dias no mesmo sítio exige disciplina e paciência: por vezes o amanhecer não oferece nada e é preciso voltar no dia seguinte.","El equipo trabajó con una cámara, dos ópticas fijas y un grabador de sonido. Gran parte de la película nació de lo que ocurrió cuando ya habíamos decidido recoger los trípodes.":"A equipa trabalhou com uma câmara, duas óticas fixas e um gravador de som. Grande parte do filme nasceu do que aconteceu quando já tínhamos decidido recolher os tripés.","Taller abierto de montaje documental":"Workshop aberto de montagem documental","Cuatro sesiones con Lisandra Fuentes para aprender a montar sin guion previo.":"Quatro sessões com Lisandra Fuentes para aprender a montar sem argumento prévio.","Lisandra Fuentes, montadora de la productora,
