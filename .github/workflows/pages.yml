
# Publica la web cuando hay cambios en main o se ejecuta manualmente.
# Valida el contenido, optimiza imágenes, regenera páginas y publica en GitHub Pages.

name: Publicar web

on:
  push:
    branches:
      - main
  workflow_dispatch:
  # Cada 30 minutos: publica lo que se programó desde el panel («Programar publicación»)
  schedule:
    - cron: "7,37 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-24.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Optimizar imágenes
        run: |
          pip install --quiet pillow
          python tools/optimize-images.py .

      - name: Guardar las imágenes optimizadas en el repositorio
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uploads content
          if ! git diff --cached --quiet; then
            git commit -q -m "Optimiza imágenes automáticamente"
            git pull --rebase -q && git push -q || {
              git rebase --abort 2>/dev/null
              echo "No se pudo guardar en el repositorio; la web se publica igualmente optimizada."
            }
          fi

      - name: Validar contenido
        run: node tools/validate-content.mjs .

      - name: Regenerar páginas
        run: node tools/build-pages.mjs .

      - name: Tarjetas y enlaces de los correos automáticos
        run: python tools/mailerlite/cards.py .

      - name: Retirar borradores y publicaciones programadas
        run: node tools/publish-filter.mjs .

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v6

      - name: Preparar artefacto de publicación
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
